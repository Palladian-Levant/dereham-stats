    const chips = real.length > 1 ? `<div class="pills" style="margin-bottom:12px" role="group" aria-label="Start the bracket from">${real.map(x => `<button data-cupstart="${x.i}" class="${x.i === start ? 'on' : ''}" aria-pressed="${x.i === start}">From ${esc(x.c.name.toLowerCase())}</button>`).join('')}</div>` : '';
    const anyP = cup.columns.some(c => c.ties.some(t => t && t.p));
    main = `<section class="card l8"><div class="card-h"><h2>The knockout</h2><span class="aside only-narrow">Swipe for later rounds</span></div>${chips}${bracketHtml(cup, start)}
      <p class="note">Your ties have the heavy outline. Each round is drawn after the last, so the dashed boxes aren't fixed match-ups yet.${anyP ? ` Percentages are win chances, shown where both teams play in ${esc(D.division)}.` : ''}</p></section>`;
    prelim = cup.prelim.map(p => `<details class="card flush fold"${WIDE() ? ' open' : ''}><summary><h2>${esc(p.name)}</h2><span class="sum">${plural(p.ties.length, 'tie')}</span></summary>
      <div class="ties">${p.ties.map(t => `<div class="tie"><span class="nm ${t.winner === 'h' ? 'w' : ''}">${tname(t, 'h')}</span><span class="sc">${scoreText(t, 'h')}</span><span class="nm ${t.winner === 'a' ? 'w' : ''}">${tname(t, 'a')}</span><span class="sc">${scoreText(t, 'a')}</span><span class="meta">${tieMeta(t)}</span></div>`).join('')}</div></details>`).join('');
  }
  const others = CUP.other.map(o => {
    const s = o.status, t = s.tie ? cupTie(s.tie) : null, r = t ? tieResultFor(t) : null;
    const line = s.state === 'out' && r ? `<span class="tag miss">${IC.cross}Knocked out</span> <span class="muted">Lost ${r.gf}–${r.ga} ${r.home ? 'v' : 'at'} ${esc(r.opp)}</span>`
      : s.state === 'next' && r ? `<span class="tag ok">${IC.check}Still in</span> <span class="muted">${r.home ? 'v' : 'at'} ${esc(r.opp)}, ${fdate(t.date, true)}</span>`
      : s.state === 'through' ? `<span class="tag ok">${IC.check}Still in</span> <span class="muted">Waiting for the next round</span>` : '';
    return `<section class="card flush ${cup ? '' : 'm6'}"><div class="card-h"><h2>${esc(o.name)}</h2></div><p class="in line">${line}</p>${runList(o.run)}
      <p class="note">Only your own games are shown for this cup, because the full draw isn't on your league's Full-Time pages.</p></section>`;
  }).join('');
  return `<div class="page">${head}${tabs}<div class="grid">${cup ? `<div class="stack l4">${cupStatus(cup)}${others}</div>${main}${prelim}` : others}</div>${footer()}</div>`;
}

function notFound() {
  return `<div class="page">${card('', empty('That page isn\'t in this week\'s data', 'The link may be from an older update, and games get new links once they\'ve been played.', '<br><a class="btn primary" href="#/">Go to the next match</a>'))}</div>`;
}

/* ================= sheets: bottom sheet on phones, side panel on laptops ================= */
const $ = id => document.getElementById(id);
const sheet = $('sheet'), sheetTitle = $('sheet-title'), sheetBody = $('sheet-body');
function openSheet(title, html) {
  sheetTitle.textContent = title; sheetBody.innerHTML = html;
  if (!sheet.open) sheet.showModal();
  sheetBody.scrollTop = 0;
}
function example(key) {
  const me = T[ME], f = BY[D.next], n = esc(name(ME));
  const eg = {
    chance: f ? `Next up: ${esc(name(f.home))} ${pct(f.p.h)}, draw ${pct(f.p.d)}, ${esc(name(f.away))} ${pct(f.p.a)}.` : '',
    verdict: f ? `Next up: ${esc(vText(f, f.p))} (${pct(f.p.h)} against ${pct(f.p.a)}).` : '',
    strength: `${n} are ${sgn(me.power, 2)}, ${rkText(me.rk.power)}.`,
    attack: `${n} are ${rel(me.att)}, ${rkText(me.rk.att)}.`,
    defence: `${n} are ${rel(me.def)}, ${rkText(me.rk.def)}.`,
    form: `${n} are ${sgn(me.formr, 1)} over their last 5, ${rkText(me.rk.form)}.`,
    luck: `${n} have ${me.apts} points where their performances would usually earn ${me.xpts.toFixed(1)}, so ${sgn(me.luck, 1)}.`,
    runin: `${n} have ${plural(me.n_rem, 'game')} left: the ${ord(me.rk.sos_rem)} hardest set in the division.`,
    xg: f ? `Next up: ${esc(sname(f.home))} ${f.xg[0].toFixed(1)}, ${esc(sname(f.away))} ${f.xg[1].toFixed(1)}.` : '',
    projected: me.sim ? `${n}: about ${Math.round(me.sim.xp)} points, a ${pct(me.sim.fin[0])} chance of winning the league and ${pct(sum(me.sim.fin.slice(0, 3)))} of a top-3 finish.` : '',
    called: D.scorecard && D.scorecard.n ? `So far this season it has called ${D.scorecard.hits} of ${D.scorecard.n} results.` : '',
  }[key];
  return eg ? `<div class="eg">${eg}</div>` : '';
}
function explain(key) {
  const g = G[key];
  const list = `<ul class="gloss">${G_ORDER.filter(k => k !== key).map(k => `<li><button data-ex="${k}">${G[k].t}</button></li>`).join('')}</ul>`;
  if (g) openSheet(g.t, `<p class="lead">${g.d}</p>${g.more ? `<p>${g.more}</p>` : ''}${example(key)}<h3>Everything else, explained</h3>${list}`);
  else openSheet('How this works', `<p class="lead">Match Stats reads every league result on FA Full-Time, rates each team's attack and defence from them, and uses those ratings to work out the chances for every game still to play.</p>
    <p>Anything with a dotted underline can be tapped for a plain explanation. They're all listed here too.</p>${list}`);
}

/* ================= search: Ctrl+K on a laptop, the search button on a phone ================= */
const sd = $('search'), si = $('search-in'), sl = $('search-list');
let INDEX = null, sItems = [], sSel = 0;
function buildIndex() {
  const out = [];
  const add = (grp, t, s, o) => out.push(Object.assign({ grp, t, s, hay: (t + ' ' + (s || '') + ' ' + (o.kw || '')).toLowerCase() }, o));
  add('Pages', 'Next match', 'Home', { h: '#/', ic: IC.page });
  add('Pages', 'Fixtures', 'Upcoming games and chances', { h: '#/fixtures', set: 'fxMode=up', ic: IC.page });
  add('Pages', 'Results', 'Scores, and whether the model called them', { h: '#/fixtures', set: 'fxMode=res', ic: IC.page });
  add('Pages', 'Table', D.division || 'League table', { h: '#/table', ic: IC.table, kw: 'league standings' });
  add('Pages', 'Cup', 'Knockout bracket and your cup run', { h: '#/cup', ic: IC.cup });
  add('Pages', 'Stats', 'Leaderboards', { h: '#/stats', ic: IC.page, kw: 'leaderboards scorers' });
  add('Pages', 'Compare two teams', 'Side by side', { h: '#/compare', ic: IC.swap, kw: 'versus vs head to head' });
  add('Pages', 'Model record', 'How often it\'s been right', { h: '#/stats/model', ic: IC.check, kw: 'accuracy' });
  add('Pages', 'How this works', 'What every number means', { ex: '', ic: IC.help, kw: 'help glossary explain' });
  IDS.forEach(id => add('Teams', name(id), `${ord(T[id].row.pos)}, ${plural(T[id].row.Pts, 'point')}`, { h: `#/team/${id}`, team: id, kw: AB[id] }));
  IDS.forEach(id => (T[id].players || []).forEach(p => add('Players', p.n, `${name(id)}${p.g ? ', ' + plural(p.g, 'goal') : ''}`, { h: `#/team/${id}`, set: 'teamTab=players', ic: IC.person })));
  FX.forEach(f => add('Fixtures', `${name(f.home)} v ${name(f.away)}`, fdate(f.date, true), { h: `#/match/${f.id}`, ic: IC.ball, mine: f.home === ME || f.away === ME }));
  RES.forEach(r => add('Results', r.kind === 'played' ? `${name(r.home)} ${r.hg}–${r.ag} ${name(r.away)}` : `${name(r.home)} v ${name(r.away)} (walkover)`, fdate(r.date), { h: `#/match/${r.id}`, ic: IC.ball, mine: r.home === ME || r.away === ME }));
  G_ORDER.forEach(k => add('Explained', G[k].t, 'What it means', { ex: k, ic: IC.help }));
  return out;
}
function searchRun(q) {
  INDEX = INDEX || buildIndex();
  const toks = q.toLowerCase().split(/\s+/).filter(t => t && !['v', 'vs', 'and', 'compare', 'with', 'against'].includes(t));
  let items;
  if (!toks.length) {
    const opp = nextOpp(), pick = t => INDEX.find(x => x.t === t);
    items = [pick('Next match'), INDEX.find(x => x.team === ME), opp ? { grp: 'Suggested', t: `Compare ${sname(ME)} and ${sname(opp)}`, s: 'Side by side', h: `#/compare/${ME}/${opp}`, ic: IC.swap } : null,
      pick('Table'), pick('Results'), pick('How this works')].filter(Boolean).map(x => Object.assign({}, x, { grp: 'Suggested' }));
  } else {
    items = INDEX.filter(x => toks.every(t => x.hay.includes(t)));
    const order = ['Teams', 'Players', 'Fixtures', 'Results', 'Pages', 'Explained'];
    items.sort((a, b) => (order.indexOf(a.grp) - order.indexOf(b.grp)) || ((b.mine ? 1 : 0) - (a.mine ? 1 : 0)));
    const caps = {}; items = items.filter(x => (caps[x.grp] = (caps[x.grp] || 0) + 1) <= (x.grp === 'Teams' ? 6 : 5));
    // Two team names typed together ("holt heacham") offer the comparison; one offers a comparison with Dereham.
    const hit = IDS.filter(id => toks.some(t => t.length >= 3 && (name(id).toLowerCase().includes(t) || AB[id].toLowerCase() === t)));
    if (hit.length === 2) items.unshift({ grp: 'Compare', t: `Compare ${sname(hit[0])} and ${sname(hit[1])}`, s: 'Side by side', h: `#/compare/${hit[0]}/${hit[1]}`, ic: IC.swap });
    else if (hit.length === 1 && hit[0] !== ME) items.splice(1, 0, { grp: 'Teams', t: `Compare ${sname(hit[0])} with ${sname(ME)}`, s: 'Side by side', h: `#/compare/${ME}/${hit[0]}`, ic: IC.swap });
  }
  sItems = items; sSel = 0;
  if (!items.length) { sl.innerHTML = empty('Nothing matches', `No team, player or game called "${esc(q)}". Try a club name like "Holt", or a surname.`); si.removeAttribute('aria-activedescendant'); return; }
  let grp = null;
  sl.innerHTML = items.map((x, i) => `${x.grp !== grp ? `<div class="s-group" role="presentation">${grp = x.grp}</div>` : ''}<a class="s-item" role="option" id="s-${i}" data-i="${i}" href="${x.h || '#'}" aria-selected="${i === 0}">
    ${x.team ? mono(x.team) : `<span class="s-ic">${x.ic || IC.page}</span>`}<span class="s-t"><b>${esc(x.t)}</b>${x.s ? `<span>${esc(x.s)}</span>` : ''}</span></a>`).join('');
  si.setAttribute('aria-activedescendant', 's-0');
}
function searchMove(d) {
  if (!sItems.length) return;
  sSel = (sSel + d + sItems.length) % sItems.length;
  sl.querySelectorAll('.s-item').forEach((el, i) => { el.setAttribute('aria-selected', i === sSel); if (i === sSel) el.scrollIntoView({ block: 'nearest' }); });
  si.setAttribute('aria-activedescendant', 's-' + sSel);
}
function searchGo(i) {
  const x = sItems[i]; if (!x) return;
  sd.close();
  if (x.set) { const [k, v] = x.set.split('='); S[k] = v; if (k === 'teamTab') render.keepTab = true; }
  if (x.ex != null) { explain(x.ex); return; }
  if (location.hash === x.h) render(false); else location.hash = x.h;
}
function openSearch() { if (sd.open) return; if (sheet.open) sheet.close(); si.value = ''; searchRun(''); sd.showModal(); si.focus(); }
si.addEventListener('input', () => searchRun(si.value.trim()));
si.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); searchMove(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); searchMove(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); searchGo(sSel); }
});
sl.addEventListener('click', e => { const a = e.target.closest('.s-item'); if (a) { e.preventDefault(); searchGo(+a.dataset.i); } });
$('search-btn').addEventListener('click', openSearch);
$('help-btn').addEventListener('click', () => explain(''));
[sheet, sd].forEach(dlg => dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) dlg.close(); }));

/* ================= routing ================= */
const view = $('view'), topBar = $('top');
const scrollMem = {};
let current = null, navDepth = 0, lastTeam = null, first = true;

function resolve() {
  const h = location.hash || '#/';
  let m;
  if ((m = h.match(/^#\/match\/(\w+)/))) { const x = BY[m[1]];
    return { tab: 'fixtures', detail: true, title: x ? `${sname(x.home)} v ${sname(x.away)}` : 'Match', doc: x ? `${name(x.home)} v ${name(x.away)}` : 'Match', html: () => pageMatch(m[1]) }; }
  if ((m = h.match(/^#\/team\/([\w-]+)/))) return { tab: 'table', detail: true, title: T[m[1]] ? T[m[1]].name : 'Team', html: () => pageTeam(m[1]), key: 'team:' + m[1] };
  if ((m = h.match(/^#\/compare\/([\w-]+)\/([\w-]+)/))) return { tab: 'compare', detail: true, title: 'Compare', doc: T[m[1]] && T[m[2]] ? `${name(m[1])} and ${name(m[2])} compared` : 'Compare', html: () => pageCompare(m[1], m[2]) };
  if (h.startsWith('#/compare')) { history.replaceState(null, '', `#/compare/${ME}/${nextOpp()}`); return resolve(); }
  if (h.startsWith('#/fixtures')) return { tab: 'fixtures', title: S.fxMode === 'res' ? 'Results' : 'Fixtures', html: pageFixtures };
  if (h.startsWith('#/table')) return { tab: 'table', title: 'Table', html: pageTable };
  if (h.startsWith('#/stats/model')) return { tab: 'stats', title: 'Model record', html: pageModel };
  if (h.startsWith('#/stats')) return { tab: 'stats', title: 'Stats', html: pageStats };
  if (h.startsWith('#/cup')) return { tab: 'cup', title: 'Cup', html: pageCup };
  const f = BY[D.next];
  return { tab: 'home', title: 'Next match', doc: f ? `${name(f.home)} v ${name(f.away)}` : 'Next match', html: pageHome };
}

function render(keepScroll) {
  const r = resolve();
  if (r.key && r.key !== lastTeam && !render.keepTab) S.teamTab = 'ov';
  render.keepTab = false;
  lastTeam = r.key || lastTeam;
  for (const k in CH) delete CH[k];
  hideTip();
  view.innerHTML = r.html();
  drawCharts();
  const wide = WIDE();
  document.querySelectorAll('.nav a[data-tab]').forEach(a => { const on = a.dataset.tab === r.tab || (r.tab === 'compare' && a.dataset.tab === 'stats' && !wide);
    a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  topBar.classList.toggle('detail', !!r.detail);
  $('top-title').textContent = r.detail ? r.title : '';
  document.title = `${r.doc || r.title} | Match Stats`;
  if (!keepScroll) { window.scrollTo(0, scrollMem[location.hash] || 0); if (!first) view.focus({ preventScroll: true }); }
  current = location.hash;
  if (first) { first = false; intro(); }
}
// The one bit of motion nobody asked for: on first load the big numbers count up and the bar fills, once.
function intro() {
  if (!MOTION()) return;
  const bar = view.querySelector('.stage .split'), nums = view.querySelectorAll('.stage .tri-n b');
  if (!bar) return;
  const segs = Array.from(bar.children), target = segs.map(s => s.style.flexGrow || s.style.flex);
  segs.forEach(s => { s.style.flex = '1 1 0'; });
  bar.classList.add('grow');
  requestAnimationFrame(() => requestAnimationFrame(() => segs.forEach((s, i) => { s.style.flex = target[i]; })));
  const ends = Array.from(nums).map(b => parseInt(b.textContent, 10)), t0 = performance.now();
  if (ends.some(isNaN)) return;
  const step = t => { const k = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - k, 3);
    nums.forEach((b, i) => { b.textContent = Math.round(ends[i] * e) + '%'; }); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function swap(fn) {
  if (document.startViewTransition && MOTION()) document.startViewTransition(fn); else fn();
}
function goBack() { if (navDepth > 0) history.back(); else location.hash = '#/'; }

window.addEventListener('hashchange', () => { if (current != null) scrollMem[current] = window.scrollY; navDepth++; swap(() => render(false)); });
$('back').addEventListener('click', goBack);

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-back]')) { goBack(); return; }
  const exb = t.closest('[data-ex]');
  if (exb) { e.preventDefault(); explain(exb.dataset.ex); return; }
  const cht = t.closest('[data-chtable]');
  if (cht) { const fig = cht.closest('.card, .st-side'), h = fig && fig.querySelector('h2'); openSheet(h ? h.textContent : 'Chart data', chartTable(cht.dataset.chtable)); return; }
  const set = t.closest('[data-set]');
  if (set) {
    const [k, v] = set.dataset.set.split('=');
    S[k] = v;
    if (k === 'teamTab') render.keepTab = true;
    if (set.tagName === 'A' && set.getAttribute('href') !== location.hash) return;   // the link navigates; rendering happens on hashchange
    e.preventDefault(); render.keepTab = false; render(true);
    const again = view.querySelector(`[data-set="${k}=${v}"]`); if (again) again.focus({ preventScroll: true });
    return;
  }
  const cb = t.closest('[data-cup]');
  if (cb) { S2.cupIdx = +cb.dataset.cup; S2.cupStart = null; render(true); return; }
  const cs = t.closest('[data-cupstart]');
  if (cs) { S2.cupStart = +cs.dataset.cupstart; render(true); return; }
  if (t.closest('[data-swap]')) { const m = location.hash.match(/^#\/compare\/([\w-]+)\/([\w-]+)/); if (m) { history.replaceState(null, '', `#/compare/${m[2]}/${m[1]}`); render(true); } return; }
  const tr = t.closest('tr[data-href]');
  if (tr && !t.closest('a,button')) { location.hash = tr.dataset.href; }
});
document.addEventListener('change', e => {
  const s = e.target.closest('select[data-cmp]');
  if (!s) return;
  const a = document.querySelector('select[data-cmp="a"]').value, b = document.querySelector('select[data-cmp="b"]').value;
  history.replaceState(null, '', `#/compare/${a}/${b}`);
  render(true);
  const again = document.querySelector(`select[data-cmp="${s.dataset.cmp}"]`); if (again) again.focus();
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '');
  if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); openSearch(); }
  else if (e.key === '/' && !typing && !sd.open && !sheet.open) { e.preventDefault(); openSearch(); }
});

// Redraw charts when the width changes; rebuild the page when it crosses a layout breakpoint.
let resizeT = null, bp = [WIDE(), window.innerWidth < 560];
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => {
  const now = [WIDE(), window.innerWidth < 560];
  if (now[0] !== bp[0] || now[1] !== bp[1]) { bp = now; render(true); } else drawCharts();
}, 120); });
// Keep "kicks off in 2h 10m" honest while the page stays open.
setInterval(() => document.querySelectorAll('.count[data-iso]').forEach(el => { const c = countdown(el.dataset.iso); if (c) el.textContent = c.t; }), 30000);

/* ================= go ================= */
if (navigator.platform && /Mac|iPhone|iPad/.test(navigator.platform)) { const k = document.querySelector('.search-btn kbd'); if (k) k.textContent = '⌘K'; }
$('upd').textContent = `Updated ${updText()}`;
render(false);
})();
</script>
</body>
</html>
