<script>(function () {
'use strict';

/* ================= data ================= */
const D = JSON.parse(document.getElementById('data').textContent);
const T = D.teams, ME = D.me, RES = D.results, FX = D.fixtures;
const BY = {};
RES.forEach(r => { BY[r.id] = r; });
FX.forEach(f => { BY[f.id] = f; });
const IDS = Object.keys(T).sort((a, b) => T[a].row.pos - T[b].row.pos);
const N = IDS.length;

/* ================= helpers ================= */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = x => x == null ? '–' : Math.round(x * 100) + '%';
const sgn = (x, d = 1) => x == null ? '–' : (x > 0.0005 ? '+' : x < -0.0005 ? '−' : '') + Math.abs(x).toFixed(d);
const ord = n => n + ((n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'));
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const pad = n => String(n).padStart(2, '0');
const dt = iso => iso ? new Date(iso) : null;
// Days from today in the viewer's own time: 0 = today, 1 = tomorrow, -1 = yesterday.
function dayDiff(iso) {
  const d = dt(iso); if (!d) return null;
  const now = new Date();
  return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
}
function fdate(iso, time) {
  const d = dt(iso); if (!d) return 'TBC';
  const dd = dayDiff(iso);
  let s = dd === 0 ? 'Today' : dd === 1 ? 'Tomorrow' : dd === -1 ? 'Yesterday' : `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
  if (time && (d.getHours() || d.getMinutes())) s += `, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return s;
}
const fshort = iso => { const d = dt(iso); return d ? `${d.getDate()} ${MON[d.getMonth()]}` : ''; };
const dayKey = iso => iso ? iso.slice(0, 10) : 'tbc';
const name = id => T[id] ? T[id].name : id;
const by = (f, dir = 1) => (x, y) => (f(x) > f(y) ? dir : f(x) < f(y) ? -dir : 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Unique three-letter codes (Dereham keeps DER; clashes get an alternative).
const AB = (() => {
  const out = {}, used = new Set();
  const cands = nm => {
    const w = nm.replace(/[^A-Za-z ]/g, '').split(/\s+/).filter(Boolean).map(x => x.toUpperCase());
    const a = w[0] || nm.toUpperCase();
    const cons = a.slice(1).replace(/[AEIOU]/g, '');
    const c = [a.slice(0, 3), a[0] + cons.slice(0, 2), a.slice(0, 2) + (w[1] || '')[0], a[0] + (w[1] || '')[0] + (w[2] || '')[0]];
    return c.filter(x => x && x.length === 3 && !/undefined/.test(x));
  };
  [ME, ...IDS.filter(i => i !== ME)].forEach((id, i) => {
    const c = cands(T[id].name).find(x => !used.has(x)) || (T[id].name.slice(0, 2).toUpperCase() + i);
    used.add(c); out[id] = c;
  });
  return out;
})();

const badge = (id, cls = '') => `<span class="bdg ${id === ME ? 'me' : ''} ${cls}" title="${esc(name(id))}"><span>${AB[id]}</span></span>`;
const tlink = id => `<a class="tl" href="#/team/${id}">${esc(name(id))}</a>`;
const chipsHtml = s => (s || '').split('').map(c => `<span class="chip ${c}">${c}</span>`).join('') || '<span class="muted">–</span>';
const dotsHtml = s => `<span class="form-dots">${(s || '').split('').map(c => `<i class="${c}" title="${c}"></i>`).join('')}</span>`;
const rkPill = (r, label) => `<span class="rk ${r <= 3 ? 'top' : r >= N - 2 ? 'bot' : ''}">${label || ord(r)}</span>`;

function verdict(pa, pb) {
  const g = pa - pb, a = Math.abs(g);
  if (a < 0.05) return { tone: 'even', lvl: '', fav: null };
  const lvl = a < 0.15 ? 'slight favourites' : a < 0.30 ? 'favourites' : 'strong favourites';
  return { tone: g > 0 ? 'good' : 'bad', lvl, fav: g > 0 ? 'A' : 'B' };
}
const YOU_TAG = { 'slight favourites': ['Slight favourites', 'Slight underdogs'], favourites: ['Favourites', 'Underdogs'], 'strong favourites': ['Strong favourites', 'Big underdogs'] };
function vTag(v, A, B) {
  if (!v.fav) return `<span class="vtag even">Too close to call</span>`;
  if (A === ME) return `<span class="vtag ${v.tone}">${YOU_TAG[v.lvl][v.fav === 'A' ? 0 : 1]}</span>`;
  const short = { 'slight favourites': 'Slight favs', favourites: 'Favs', 'strong favourites': 'Strong favs' }[v.lvl];
  return `<span class="vtag neu">${short}: ${AB[v.fav === 'A' ? A : B]}</span>`;
}
function vSentence(v, A, B, pa, pb, pd) {
  if (!v.fav) return `Too close to call: ${A === ME ? 'you' : esc(name(A))} ${pct(pa)}, ${esc(name(B))} ${pct(pb)}, draw ${pct(pd)}.`;
  const fav = v.fav === 'A' ? A : B, dog = v.fav === 'A' ? B : A;
  const pf = v.fav === 'A' ? pa : pb, pg = v.fav === 'A' ? pb : pa;
  if (fav === ME) return `You're ${v.lvl}: you win ${pct(pf)} of the time, ${esc(name(dog))} ${pct(pg)}.`;
  return `${esc(name(fav))} are ${v.lvl}: they win ${pct(pf)} of the time, ${dog === ME ? 'you' : esc(name(dog))} ${pct(pg)}.`;
}

// Side A = Dereham when they're involved, otherwise the home team. A is blue, B orange.
function sides(m) {
  const A = m.away === ME ? m.away : m.home;
  const B = A === m.home ? m.away : m.home;
  return { A, B, aHome: A === m.home };
}
function oddsAB(m, p) {
  const s = sides(m);
  return Object.assign({ pa: s.aHome ? p.h : p.a, pb: s.aHome ? p.a : p.h, pd: p.d }, s);
}
function histAB(f) {
  const s = sides(f);
  return f.hist.map(h => ({ d: h.d, a: s.aHome ? h.h : h.a, b: s.aHome ? h.a : h.h, dr: h.dr }));
}
function deltaA(f) {
  const h = histAB(f);
  if (h.length < 2) return null;
  return h[h.length - 1].a - h[h.length - 2].a;
}
// Places moved in the table since roughly a week ago (the last standings at least 4 days older than the latest).
function movement(id) {
  const h = T[id] && T[id].pos_hist; if (!h || h.length < 2) return null;
  const last = h[h.length - 1], cut = dt(last.d).getTime() - 4 * 864e5;
  let base = null; h.forEach(x => { if (dt(x.d).getTime() <= cut) base = x; });
  return base ? { n: base.pos - last.pos, since: base.d } : null;
}
const mvCell = m => !m ? '<span class="mv">–</span>'
  : m.n > 0 ? `<span class="mv up" title="Up ${m.n} since ${fshort(m.since)}">▲${m.n}</span>`
  : m.n < 0 ? `<span class="mv down" title="Down ${-m.n} since ${fshort(m.since)}">▼${-m.n}</span>`
  : `<span class="mv" title="No change since ${fshort(m.since)}">–</span>`;
const mvText = m => !m ? '' : m.n > 0 ? `, up ${m.n} since ${fshort(m.since)}` : m.n < 0 ? `, down ${-m.n} since ${fshort(m.since)}` : `, same as on ${fshort(m.since)}`;
const updText = () => { const s = fdate(D.updated, true); return /^(Today|Yesterday|Tomorrow)/.test(s) ? s[0].toLowerCase() + s.slice(1) : s; };
const deltaSince = f => f.hist.length >= 2 ? `since ${fshort(f.hist[f.hist.length - 2].d)}` : '';
function deltaHtml(d, label) {
  if (d == null || Math.abs(d) < 0.005) return '';
  return `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.round(Math.abs(d) * 100)}%</span>${label ? `<span class="since">${label}</span>` : ''}`;
}

// The model, so the compare page can price any pairing.
function poisson(k, l) { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; }
function predict(h, a) {
  const ha = D.home_adv, avg = D.avg, att = t => T[t].att, dfn = t => 1 / T[t].def;
  const lh = avg * ha * att(h) * dfn(a), la = avg / ha * att(a) * dfn(h), rho = -0.08, n = 12;
  let ph = 0, pd = 0, pa = 0, s = 0;
  const M = [];
  for (let i = 0; i <= n; i++) { M[i] = []; for (let j = 0; j <= n; j++) M[i][j] = poisson(i, lh) * poisson(j, la); }
  M[0][0] *= Math.max(0, 1 - lh * la * rho); M[0][1] *= Math.max(0, 1 + lh * rho);
  M[1][0] *= Math.max(0, 1 + la * rho); M[1][1] *= Math.max(0, 1 - rho);
  for (let i = 0; i <= n; i++) for (let j = 0; j <= n; j++) { s += M[i][j]; if (i > j) ph += M[i][j]; else if (i === j) pd += M[i][j]; else pa += M[i][j]; }
  return { h: ph / s, d: pd / s, a: pa / s, xg: [lh, la] };
}

// A team's results from its own point of view, oldest first.
function games(id) {
  return RES.filter(r => r.kind === 'played' && (r.home === id || r.away === id))
    .slice().sort(by(r => r.date)).map(r => {
      const home = r.home === id, gf = home ? r.hg : r.ag, ga = home ? r.ag : r.hg;
      return { r, opp: home ? r.away : r.home, venue: home ? 'H' : 'A', gf, ga,
        res: gf > ga ? 'W' : gf < ga ? 'L' : 'D', pre: r.pre ? (home ? r.pre.h : r.pre.a) : null };
    });
}
const fixturesOf = id => FX.filter(f => f.home === id || f.away === id);
const meetings = (a, b) => RES.filter(r => r.kind === 'played' && ((r.home === a && r.away === b) || (r.home === b && r.away === a)));
function commonOpps(a, b) {
  const ga = games(a), gb = games(b), out = [];
  const opps = new Set(ga.map(g => g.opp).filter(o => o !== b && gb.some(x => x.opp === o)));
  opps.forEach(o => out.push({ o, a: ga.filter(g => g.opp === o), b: gb.filter(g => g.opp === o) }));
  return out.sort(by(x => T[x.o].row.pos));
}
const ppg = gs => gs.length ? gs.reduce((s, g) => s + (g.res === 'W' ? 3 : g.res === 'D' ? 1 : 0), 0) / gs.length : 0;

/* ================= charts ================= */
const CH = {}; let chSeq = 0;
// The one bit of motion: the home screen's chart draws in and the big number counts up, once.
const ANIM = { ok: !window.matchMedia('(prefers-reduced-motion: reduce)').matches };
const FMT = { pct: v => pct(v), num: v => sgn(v, 2), pos: v => ord(v), pts: v => Math.round(v) + ' pts' };

// series: [{name, cls ('a'|'b'|'d'|'n'), vals:[number|null]}]
function lineChart(o) {
  const id = 'c' + (++chSeq); CH[id] = { type: 'line', o };
  const legend = o.series.length > 1 ? `<div class="legend">${o.series.map(s => `<span><i class="sw ${s.cls}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<div class="chart">${legend}<div class="ch" data-ch="${id}" style="height:${o.h || 168}px"></div>${o.note ? `<p class="note">${o.note}</p>` : ''}</div>`;
}
function lineSvg(id, o, W) {
  const H = o.h || 168, L = o.fmt === 'pos' ? 30 : 34, R = 38, TP = 10, B = 22;
  const all = []; o.series.forEach(s => s.vals.forEach(v => { if (v != null) all.push(v); }));
  if (!all.length) return '';
  let lo, hi, ticks;
  if (o.fmt === 'pct') {
    lo = 0; hi = Math.min(1, Math.ceil((Math.max(...all) + 0.06) * 10) / 10);
    const step = hi <= 0.6 ? 0.1 : 0.2; ticks = []; for (let t = 0; t <= hi + 1e-9; t += step) ticks.push(+t.toFixed(2));
  } else if (o.fmt === 'pos') {
    lo = 1; hi = N; ticks = [1, Math.round((N + 1) / 2), N];
  } else {
    const mn = Math.min(...all, o.zero ? 0 : Infinity), mx = Math.max(...all, o.zero ? 0 : -Infinity);
    const step = (mx - mn) > 3 ? 1 : 0.5;
    lo = Math.floor((mn - 0.15) / step) * step; hi = Math.ceil((mx + 0.15) / step) * step;
    ticks = []; for (let t = lo; t <= hi + 1e-9; t += step) ticks.push(+t.toFixed(2));
  }
  const n = o.labels.length;
  const x = i => n === 1 ? (L + (W - L - R) / 2) : L + i * (W - L - R) / (n - 1);
  const y = v => o.fmt === 'pos' ? TP + (v - lo) / (hi - lo) * (H - TP - B) : TP + (1 - (v - lo) / (hi - lo)) * (H - TP - B);
  let g = '';
  ticks.forEach(t => {
    const lab = o.fmt === 'pct' ? Math.round(t * 100) + '%' : o.fmt === 'pos' ? ord(t) : (t > 0 ? '+' : t < 0 ? '−' : '') + Math.abs(t).toFixed(Math.abs(t) % 1 ? 1 : 0);
    g += `<line x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" class="${o.zero && t === 0 ? 'zero' : 'gl'}"/>`;
    g += `<text x="${L - 6}" y="${(y(t) + 3.5).toFixed(1)}" class="ax" text-anchor="end">${lab}</text>`;
  });
  let lines = '', defs = '';
  const order = o.series.slice().sort((a, b) => (a.cls === 'd' ? -1 : 0) - (b.cls === 'd' ? -1 : 0));
  order.forEach((s, si) => {
    // Split into unbroken runs, then draw each as a smooth curve that never overshoots the data.
    const runs = []; let cur = [];
    s.vals.forEach((v, i) => { if (v == null) { if (cur.length) runs.push(cur); cur = []; } else cur.push([x(i), y(v)]); });
    if (cur.length) runs.push(cur);
    runs.forEach(run => {
      const d = smoothPath(run);
      if (s.area && run.length > 1) {
        const gid = `${id}g${si}`, base = (H - B).toFixed(1);
        defs += `<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1" style="color:var(--${s.cls === 'n' ? 'ink' : s.cls})"><stop offset="0" stop-color="currentColor" stop-opacity=".13"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient>`;
        lines += `<path d="${d}L${run[run.length - 1][0].toFixed(1)},${base}L${run[0][0].toFixed(1)},${base}Z" class="area" fill="url(#${gid})"/>`;
      }
      lines += `<path d="${d}" class="ln ${s.cls}" pathLength="1"/>`;
    });
    const li = s.vals.length - 1 - s.vals.slice().reverse().findIndex(v => v != null);
    if (li >= 0 && s.vals[li] != null) lines += `<circle cx="${x(li).toFixed(1)}" cy="${y(s.vals[li]).toFixed(1)}" r="4.5" class="pt ${s.cls}"/>`;
  });
  // End labels, nudged apart so they never overlap.
  const ends = o.series.map(s => { const v = s.vals[s.vals.length - 1]; return v == null ? null : { s, v, y: y(v) }; }).filter(Boolean).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 12) ends[i].y = ends[i - 1].y + 12;
  const labs = ends.map(e => `<text x="${W - R + 7}" y="${(e.y + 4).toFixed(1)}" class="end ${e.s.cls}">${FMT[o.fmt](e.v)}</text>`).join('');
  // Date labels along the bottom: first, last, and a few in between when there's room.
  let xl = '';
  if (n > 1) {
    const slots = Math.max(2, Math.min(n, Math.floor((W - L - R) / 90)));
    const idx = new Set(); for (let k = 0; k < slots; k++) idx.add(Math.round(k * (n - 1) / (slots - 1)));
    idx.forEach(i => { const anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
      xl += `<text x="${x(i).toFixed(1)}" y="${H - 5}" class="ax" text-anchor="${anchor}">${fshort(o.labels[i])}</text>`; });
  }
  return `<svg class="lc ${o.anim ? 'anim' : ''}" id="${id}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" data-l="${L}" data-r="${R}" data-w="${W}" role="img" aria-label="${esc(o.aria || 'Chart')}"><defs>${defs}</defs>${g}${lines}${labs}${xl}<line class="xh" x1="0" x2="0" y1="${TP}" y2="${H - B}" visibility="hidden"/></svg>`;
}

// Monotone cubic (Fritsch–Carlson): smooth, but never bulges past the real values.
function smoothPath(p) {
  const f = v => v.toFixed(1);
  if (p.length < 3) return 'M' + p.map(q => f(q[0]) + ',' + f(q[1])).join('L');
  const n = p.length, m = [], t = [];
  for (let i = 0; i < n - 1; i++) m[i] = (p[i + 1][1] - p[i][1]) / ((p[i + 1][0] - p[i][0]) || 1);
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let d = `M${f(p[0][0])},${f(p[0][1])}`;
  for (let i = 0; i < n - 1; i++) {
    const dx = (p[i + 1][0] - p[i][0]) / 3;
    d += `C${f(p[i][0] + dx)},${f(p[i][1] + t[i] * dx)} ${f(p[i + 1][0] - dx)},${f(p[i + 1][1] - t[i + 1] * dx)} ${f(p[i + 1][0])},${f(p[i + 1][1])}`;
  }
  return d;
}

function finishChart(fin, mine) {
  const id = 'c' + (++chSeq); CH[id] = { type: 'fin', fin, mine };
  return `<div class="ch" data-ch="${id}" style="height:128px"></div>`;
}
function finSvg(c, W) {
  const fin = c.fin, mine = c.mine;
  const H = 128, L = 4, R = 4, TP = 16, B = 18, n = fin.length;
  const bw = (W - L - R) / n, mx = Math.max(...fin, 0.01);
  const top = fin.indexOf(Math.max(...fin));
  let s = '';
  fin.forEach((p, i) => {
    const gap = bw > 30 ? 4 : 2;
    const h = Math.max(p > 0 ? 2 : 0, (p / mx) * (H - TP - B)), x = L + i * bw + gap / 2, y = H - B - h;
    const tip = `<b>${ord(i + 1)} place</b>${pct(p)} chance`;
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - gap).toFixed(1)}" height="${h.toFixed(1)}" rx="3" class="fb ${mine ? 'a' : ''} ${i === top ? 'top' : ''}"/>`;
    s += `<rect x="${(L + i * bw).toFixed(1)}" y="${TP}" width="${bw.toFixed(1)}" height="${H - TP - B}" class="hit" data-tip="${esc(tip)}"/>`;
    const cx = (x + (bw - gap) / 2).toFixed(1);
    if (i === top) s += `<text x="${cx}" y="${(y - 4).toFixed(1)}" class="val" text-anchor="middle">${pct(p)}</text>`;
    if (bw > 34 || i === 0 || i === n - 1 || i === top || (i + 1) % 5 === 0) s += `<text x="${cx}" y="${H - 4}" class="ax" text-anchor="middle">${ord(i + 1)}</text>`;
  });
  return `<svg class="bc" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chance of finishing in each position">${s}</svg>`;
}

function spark(vals, cls) {
  const v = vals.filter(x => x != null); if (v.length < 2) return '';
  const W = 84, H = 26, mn = Math.min(...v), mx = Math.max(...v), r = (mx - mn) || 0.01;
  const d = v.map((p, i) => (i ? 'L' : 'M') + (2 + i * (W - 4) / (v.length - 1)).toFixed(1) + ',' + (3 + (1 - (p - mn) / r) * (H - 6)).toFixed(1)).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" class="${cls}"/></svg>`;
}

function drawCharts() {
  document.querySelectorAll('[data-ch]').forEach(el => {
    const c = CH[el.dataset.ch]; if (!c) return;
    const w = Math.max(240, Math.floor(el.clientWidth));
    el.innerHTML = c.type === 'line' ? lineSvg(el.dataset.ch, c.o, w) : finSvg(c, w);
    if (c.o) c.o.anim = false; // the draw-in plays once, not on every resize
  });
}
let resizeT = null;
let lastNarrow = window.innerWidth < 560;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => {
  const n = window.innerWidth < 560;
  if (n !== lastNarrow && (location.hash || '').startsWith('#/cup')) { lastNarrow = n; render(true); } else { lastNarrow = n; drawCharts(); }
}, 120); });

/* ================= shared pieces ================= */
const card = (title, body, aside = '', attrs = '') =>
  `<section class="card" ${attrs}>${title ? `<div class="card-h"><h3>${title}</h3>${aside ? `<span class="aside">${aside}</span>` : ''}</div>` : ''}${body}</section>`;

// One row per outcome, the likeliest in bold, with a faint bar showing its chance.
function outcomeLines(m, p, actual) {
  const mine = m.home === ME || m.away === ME;
  const lead = ['h', 'd', 'a'].reduce((x, k) => p[k] > p[x] ? k : x, 'h');
  const row = (k, team) => {
    const side = !team ? 'd' : mine ? (team === ME ? 'a' : 'b') : 'n';
    const mark = actual === k ? ' <span class="res-mark" title="What happened">✓</span>' : '';
    return `<div class="mo ${side} ${lead === k ? 'lead' : ''}"><span class="mo-bar" style="width:${(p[k] * 100).toFixed(1)}%"></span>
      ${team ? badge(team, 'sm') : '<span class="bdg sm dr">=</span>'}<span class="mo-n">${team ? esc(name(team)) : 'Draw'}${mark}</span><b>${pct(p[k])}</b></div>`;
  };
  return row('h', m.home) + row('d', null) + row('a', m.away);
}

function fxCard(f, opts = {}) {
  const o = oddsAB(f, f.p), v = verdict(o.pa, o.pb), d = deltaA(f);
  const mine = f.home === ME || f.away === ME;
  const showDelta = d != null && Math.abs(d) >= 0.005;
  const foot = showDelta || opts.flag || opts.spark
    ? `<div class="mkt-f"><span>${showDelta ? `${deltaHtml(d)}<span class="since">${AB[o.A]}, ${deltaSince(f)}</span>` : ''}${opts.flag ? ` <span class="flag">${opts.flag}</span>` : ''}</span>${opts.spark ? spark(histAB(f).map(h => h.a), 'a') : ''}</div>` : '';
  return `<a class="mkt ${mine && opts.hl !== false ? 'mine' : ''}" href="#/match/${f.id}"><div class="mkt-h"><span class="mkt-date ${dayDiff(f.date) === 0 ? 'today' : ''}">${fdate(f.date, true)}</span>${vTag(v, o.A, o.B)}</div>
    ${outcomeLines(f, f.p)}${foot}</a>`;
}

function resCard(r) {
  let tag = '';
  if (r.kind !== 'played') tag = '<span class="vtag neu">Walkover</span>';
  else if (r.pre) tag = r.upset ? `<span class="vtag upset">Upset</span>` : r.hit ? '<span class="vtag ok">Called it</span>' : '<span class="vtag miss">Missed</span>';
  const wo = r.kind !== 'played';
  const hw = wo ? r.kind === 'walkover-H' : r.hg > r.ag, aw = wo ? r.kind === 'walkover-A' : r.ag > r.hg;
  const line = (id, g, w) => `<div class="sr ${w ? 'w' : ''} ${id === ME ? 'me' : ''}">${badge(id, 'sm')}<span class="nm">${esc(name(id))}</span><b>${wo ? (w ? 'W' : '') : g}</b></div>`;
  const foot = r.pre && !wo ? `The model gave this result ${pct(r.pre[r.actual])} beforehand.` : wo ? 'Walkover: counts in the table, not the ratings.' : 'Too early in the season for a prediction.';
  return `<a class="mkt ${r.home === ME || r.away === ME ? 'mine' : ''}" href="#/match/${r.id}"><div class="mkt-h"><span class="mkt-date">${fdate(r.date)}${r.ht ? `, half-time ${r.ht[0]}–${r.ht[1]}` : ''}</span>${tag}</div>
    ${line(r.home, r.hg, hw)}${line(r.away, r.ag, aw)}<div class="mkt-f"><span>${foot}</span></div></a>`;
}

function outcomeRows(A, B, pa, pd, pb, actual) {
  const row = (cls, label, bdg, p, isActual) => {
    const odds = p > 0.01 ? (1 / p).toFixed(2) : '–';
    return `<div class="oc ${cls} ${isActual ? 'won' : ''}"><div><div class="oc-l">${bdg}<span>${label}</span>${isActual ? '<span class="res-mark" title="Actual result">✓</span>' : ''}</div>
      <div class="oc-bar"><div style="width:${(p * 100).toFixed(1)}%"></div></div></div>
      <div class="oc-p">${pct(p)}</div><div class="oc-odds" title="Fair decimal odds">${odds}</div></div>`;
  };
  return `<div class="ocs-h"><span>Outcome</span><span>Chance</span><span>Odds</span></div>
    ${row('a', esc(name(A)), badge(A), pa, actual === 'A')}${row('d', 'Draw', '<span class="bdg dr">=</span>', pd, actual === 'D')}${row('b', esc(name(B)), badge(B), pb, actual === 'B')}`;
}

function oddsChart(f, anim) {
  const h = histAB(f); if (h.length < 2) return '';
  const o = oddsAB(f, f.p);
  return lineChart({
    labels: h.map(x => x.d), fmt: 'pct', aria: 'How the odds for this game have moved', h: 180, anim: anim && ANIM.ok,
    series: [{ name: `${name(o.A)} win`, cls: 'a', vals: h.map(x => x.a), area: true }, { name: 'Draw', cls: 'd', vals: h.map(x => x.dr) }, { name: `${name(o.B)} win`, cls: 'b', vals: h.map(x => x.b) }],
    note: 'How the odds for this game looked after each matchday, using only the results known at the time. Drag across the chart to read it.'
  });
}

function hero(f, compact) {
  const o = oddsAB(f, f.p), v = verdict(o.pa, o.pb), d = deltaA(f);
  const A = o.A, B = o.B;
  const xgA = o.aHome ? f.xg[0] : f.xg[1], xgB = o.aHome ? f.xg[1] : f.xg[0], csA = o.aHome ? f.cs[0] : f.cs[1];
  const pos = id => T[id].row.pos ? ord(T[id].row.pos) : '–';
  const team = id => `<a href="#/team/${id}" class="${id === ME ? 'me' : ''}">${esc(name(id))}</a>`;
  return `<section class="hero" ${compact ? 'id="share-end"' : ''}><div class="stripes" aria-hidden="true"></div><div class="hero-in">
    <div class="m-meta"><span class="chip-s">${esc(D.division || 'League')}</span><span class="when">${fdate(f.date, true)}</span>${f.venue ? `<span>${esc(f.venue)}</span>` : ''}</div>
    <h1 class="h-teams">${team(f.home)}<span class="row2"><span class="v">v</span>${team(f.away)}</span></h1>
    <div class="m-pos">${esc(name(f.home))} are ${pos(f.home)} and ${esc(name(f.away))} ${pos(f.away)} in the table.</div>
    <div class="h-num"><span class="big ca" data-count="${Math.round(o.pa * 100)}">${pct(o.pa)}</span>
      <span class="h-lab"><span>chance ${esc(name(A))} win</span><span>${d != null && Math.abs(d) >= 0.005 ? `${deltaHtml(d)}<span class="since">${deltaSince(f)}</span>` : '<span class="since" style="margin:0">no change since last matchday</span>'}</span></span></div>
    <div class="vline">${vTag(v, A, B)}<span class="muted">${vSentence(v, A, B, o.pa, o.pb, o.pd)}</span></div>
    ${oddsChart(f, compact)}
    ${outcomeRows(A, B, o.pa, o.pd, o.pb)}
    <div class="strip"><div><b>${xgA.toFixed(1)}–${xgB.toFixed(1)}</b><span>Expected goals</span></div><div><b>${pct(csA)}</b><span>${AB[A]} clean sheet</span></div>
      <div><b>${pct(f.btts)}</b><span>Both score</span></div><div><b>${pct(f.o25)}</b><span>3+ goals</span></div></div>
    ${compact ? `<a class="more" href="#/match/${f.id}">Open the full match page</a>` : `<details class="info"><summary>How to read this</summary>
      <p>Chances come from each team's attack and defence ratings, built from every result in the division and adjusted for who they've played. Odds are fair decimal odds, 1 divided by the chance.</p>
      <p>Verdicts: within 5 points is too close to call, 5–15 points clear is slight favourites, 15–30 is favourites, and more than 30 is strong favourites.</p></details>`}
  </div></section>`;
}

const METRICS = [
  { k: 'power', label: 'Power rating', fmt: v => sgn(v, 2), hi: true, info: 'Goals better or worse than an average team per game, on a neutral pitch. Adjusted for who they have played.' },
  { k: 'att', label: 'Attack rating', fmt: v => v.toFixed(2), hi: true, info: 'Scoring compared with the division average, adjusted for the defences faced. 1.00 = average.' },
  { k: 'def', label: 'Defence rating', fmt: v => v.toFixed(2), hi: true, info: 'How hard they are to score against compared with average, adjusted for the attacks faced. 1.00 = average; higher = tighter.' },
  { k: 'formr', label: 'Form (last 5)', fmt: v => sgn(v, 1), hi: true, rk: 'form', info: 'Goal difference per game over the last 5, compared with what an average team would get against the same opponents.' },
  { k: 'luck', label: 'Points vs expected', fmt: v => sgn(v, 1), hi: true, info: 'Points won minus the points their goals for and against would normally earn. Positive = picking up more points than performances suggest (winning tight games).' },
  { k: 'sos_r', label: 'Run-in difficulty', fmt: v => sgn(v, 2), hi: false, rk: 'sos_rem', info: 'Average power rating of the teams they still have to play. Higher = a harder run-in.' },
];
const metricRange = k => { const v = IDS.map(i => T[i][k]); return [Math.min(...v), Math.max(...v)]; };

function compareBars(A, B) {
  const a = T[A], b = T[B];
  const splitV = (t, f) => t.split.all ? t.split.all[f] : 0;
  const rows = [
    ['Power rating', t => t.power, v => sgn(v, 2), true, 'power'],
    ['Attack rating', t => t.att, v => v.toFixed(2), true, 'att'],
    ['Defence rating', t => t.def, v => v.toFixed(2), true, 'def'],
    ['Points per game', t => splitV(t, 'ppg'), v => v.toFixed(2), true],
    ['Scored per game', t => splitV(t, 'gf'), v => v.toFixed(1), true],
    ['Conceded per game', t => splitV(t, 'ga'), v => v.toFixed(1), false],
    ['Clean sheets', t => splitV(t, 'cs'), v => pct(v), true],
    ['Form (last 5)', t => t.formr, v => sgn(v, 1), true, 'form'],
    ['Points vs expected', t => t.luck, v => sgn(v, 1), true, 'luck'],
  ];
  const body = rows.map(([label, get, fmt, hiBetter, rk]) => {
    const vals = IDS.map(i => get(T[i]) || 0), lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const va = get(a) || 0, vb = get(b) || 0;
    const w = v => clamp(((hiBetter ? v - lo : hi - v) / span) * 100, 4, 100);
    const aw = hiBetter ? va > vb : va < vb, bw = hiBetter ? vb > va : vb < va;
    const r = (t) => rk ? `<small>${ord(t.rk[rk])}</small>` : '';
    return `<div class="cmp"><div class="cmp-v ${aw ? 'win' : ''}">${fmt(va)}${r(a)}</div>
      <div><div class="cmp-l">${label}</div><div class="bars"><div class="bar l"><span style="width:${w(va).toFixed(0)}%"></span></div><div class="bar r"><span style="width:${w(vb).toFixed(0)}%"></span></div></div></div>
      <div class="cmp-v ${bw ? 'win' : ''}">${fmt(vb)}${r(b)}</div></div>`;
  }).join('');
  return `<div class="who"><a class="wa" href="#/team/${A}">${badge(A, 'sm')}<span>${esc(name(A))}</span></a><a class="wb" href="#/team/${B}">${badge(B, 'sm')}<span>${esc(name(B))}</span></a></div>${body}
    <p class="note">Bars show where each team sits across the whole division. Small numbers are division ranks.</p>`;
}

function gameRows(gs, id, limit) {
  const list = gs.slice().reverse().slice(0, limit || 99);
  if (!list.length) return '<div class="empty">No results yet.</div>';
  return `<ul class="games">${list.map(g => `<li><a href="#/match/${g.r.id}"><span class="chip ${g.res}">${g.res}</span><span class="dt">${fdate(g.r.date)}</span>
    <span class="op">${esc(name(g.opp))} <i>(${g.venue})</i></span><span class="gv">${g.pre != null ? `given ${pct(g.pre)}${g.r.upset && g.res === 'W' ? ', upset' : ''}` : ''}</span><span class="gs">${g.gf}–${g.ga}</span></a></li>`).join('')}</ul>`;
}

function formCard(A, B) {
  const one = id => {
    const g = games(id), t = T[id];
    return `<div class="split"><h4><a class="tl" href="#/team/${id}">${esc(name(id))}</a></h4><div style="margin:4px 0 8px">${chipsHtml(t.form)}</div>
      <div class="kv"><span>Last 5</span><b>${ppg(g.slice(-5)).toFixed(1)} pts/game</b></div><div class="kv"><span>Season</span><b>${ppg(g).toFixed(1)} pts/game</b></div>
      ${t.streak ? `<div class="kv"><span>Run</span><b>${esc(t.streak)}</b></div>` : ''}</div>`;
  };
  return card('Form', `<div class="splits">${one(A)}${one(B)}</div>`);
}

function commonCard(A, B) {
  const co = commonOpps(A, B);
  if (!co.length) return card('Common opponents', '<div class="empty">They haven\'t played any of the same teams yet.</div>');
  const res = gs => gs.map(g => `<span class="chip ${g.res} sm">${g.gf}–${g.ga}</span>`).join(' ');
  const pa = co.reduce((s, x) => s + ppg(x.a), 0) / co.length, pb = co.reduce((s, x) => s + ppg(x.b), 0) / co.length;
  return card('Common opponents', `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="l">Opponent</th><th>${AB[A]}</th><th>${AB[B]}</th></tr></thead><tbody>
    ${co.map(x => `<tr data-href="#/team/${x.o}"><td class="l">${esc(name(x.o))}</td><td>${res(x.a)}</td><td>${res(x.b)}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">Against these teams: ${esc(name(A))} ${pa.toFixed(1)} pts/game, ${esc(name(B))} ${pb.toFixed(1)}.</p>`, `${co.length}`);
}

function meetingsCard(A, B) {
  const m = meetings(A, B);
  return card('Previous meetings', m.length ? `<div class="mkts">${m.map(resCard).join('')}</div>` : '<div class="empty">No meetings yet this season.</div>');
}

function playersMini(id, n = 3) {
  const p = T[id].players.filter(x => x.g).slice(0, n);
  if (!T[id].has_players) return '<div class="muted" style="font-size:13px">No player stats on Full-Time.</div>';
  if (!p.length) return '<div class="muted" style="font-size:13px">No scorers recorded yet.</div>';
  return p.map(x => `<div class="kv"><span>${esc(x.n)}</span><b>${x.g} goal${x.g === 1 ? '' : 's'}</b></div>`).join('');
}
function playersCard(A, B) {
  if (!D.has_players) return '';
  return card('Key players', `<div class="splits"><div class="split"><h4>${esc(name(A))}</h4>${playersMini(A)}</div><div class="split"><h4>${esc(name(B))}</h4>${playersMini(B)}</div></div>
    <p class="note">Top scorers in all competitions, as entered by clubs on Full-Time.</p>`);
}

function insightsCard(list, title = 'Things to know') {
  if (!list || !list.length) return '';
  return card(title, `<ul class="ins">${list.map(t => `<li>${t}</li>`).join('')}</ul>`);
}

function resolvedCard(r) {
  if (!r || !r.pre) return '';
  const home = r.home === ME, opp = home ? r.away : r.home;
  const gf = home ? r.hg : r.ag, ga = home ? r.ag : r.hg;
  const res = gf > ga ? 'Won' : gf < ga ? 'Lost' : 'Drew';
  const win = home ? r.pre.h : r.pre.a;
  const pick = { h: `a ${esc(name(r.home))} win`, a: `a ${esc(name(r.away))} win`, d: 'a draw' }[r.call];
  return `<a class="card" href="#/match/${r.id}" style="display:block"><div class="rs-top">${r.hit ? '<span class="vtag ok">Called it</span>' : '<span class="vtag miss">Missed</span>'}<span class="rs-date">Your last game, ${fdate(r.date)}</span></div>
    <div class="rs-main"><b>${res} ${gf}–${ga}</b> ${home ? 'v' : 'at'} ${esc(name(opp))}</div>
    <div class="rs-sub">The model had you at ${pct(win)} to win and picked ${pick}.</div></a>`;
}

/* ================= pages ================= */
function pageHome() {
  const f = BY[D.next], me = T[ME];
  const mine = FX.filter(x => x.home === ME || x.away === ME);
  const hardest = mine.slice(0, 5).reduce((h, x) => (!h || oddsAB(x, x.p).pa < oddsAB(h, h.p).pa) ? x : h, null);
  const nextList = mine.length > 1 ? card(`Your next ${Math.min(5, mine.length)} games`,
    `<div class="mkts">${mine.slice(0, 5).map(x => fxCard(x, { spark: true, hl: false, flag: x === hardest ? 'Toughest' : '' })).join('')}</div>
     <a class="more" href="#/team/${ME}">See all your games</a>`) : '';
  const round = f ? FX.filter(x => x !== f && dayKey(x.date) === dayKey(f.date)) : [];
  const roundCard = round.length ? card(`Rest of the round`, `<div class="mkts">${round.map(x => fxCard(x)).join('')}</div>`, fdate(f.date)) : '';
  const s = me.sim;
  const season = card('Your season', `<div class="kpis">
      <div class="kpi"><div class="k">Position</div><div class="v"><b>${ord(me.row.pos)}</b>${mvCell(movement(ME))}<span class="rk">${me.row.Pts} pts</span></div></div>
      <div class="kpi"><div class="k">Projected points</div><div class="v"><b>${s ? Math.round(s.xp) : '–'}</b></div></div>
      <div class="kpi"><div class="k">Win the league</div><div class="v"><b>${s ? pct(s.fin[0]) : '–'}</b></div></div>
      <div class="kpi"><div class="k">Finish top 3</div><div class="v"><b>${s ? pct(s.fin.slice(0, 3).reduce((a, b) => a + b, 0)) : '–'}</b></div></div>
      <div class="kpi"><div class="k">Power rating</div><div class="v"><b>${sgn(me.power, 2)}</b>${rkPill(me.rk.power)}</div></div>
      <div class="kpi"><div class="k">Form (last 5)</div><div class="v"><b>${sgn(me.formr, 1)}</b>${rkPill(me.rk.form)}</div></div></div>
      ${D.title_pts && me.n_rem ? `<p class="note" style="font-size:13px;color:var(--ink)">Champions usually finish on about <b>${D.title_pts} points</b>: you need <b>${Math.max(0, D.title_pts - me.row.Pts)} from ${me.n_rem} games</b> (${(Math.max(0, D.title_pts - me.row.Pts) / me.n_rem).toFixed(1)} a game; you're averaging ${(me.row.Pts / Math.max(1, me.row.P)).toFixed(1)}).</p>` : ''}
      <a class="more" href="#/team/${ME}">Open your team page</a>`);
  return `<div class="page"><div class="cols"><div class="col">
      ${f ? hero(f, true) : card('', '<div class="empty">No upcoming league fixture found.</div>')}
      ${f ? insightsCard(f.ins) : ''}
      ${f ? card('Stats comparison', compareBars(sides(f).A, sides(f).B)) : ''}
    </div><div class="col">
      ${resolvedCard(BY[D.last])}${nextCupCard()}${season}${nextList}${roundCard}
    </div></div>${footer()}</div>`;
}

const S = { fxMode: 'up', fxMine: 'all', tbl: 'all', teamTab: 'ov', statsOpen: {} };

function pageFixtures() {
  const mode = S.fxMode, mine = S.fxMine === 'mine';
  const list = (mode === 'up' ? FX : RES).filter(m => !mine || m.home === ME || m.away === ME);
  const groups = [];
  list.forEach(m => { const k = dayKey(m.date); const g = groups[groups.length - 1]; if (g && g.k === k) g.items.push(m); else groups.push({ k, d: m.date, items: [m] }); });
  const body = groups.length ? groups.map(g => `<div class="date-h ${dayDiff(g.d) === 0 ? 'today' : ''}">${fdate(g.d)}</div><div class="mkts wide">${g.items.map(m => mode === 'up' ? fxCard(m) : resCard(m)).join('')}</div>`).join('')
    : '<div class="card empty">Nothing to show.</div>';
  return `<div class="page"><div class="page-h"><h1>Fixtures</h1><p>${mode === 'up' ? 'Every upcoming league game with the model\'s odds. Tap one for the full picture.' : 'Every result, with what the model said beforehand.'}</p>
    <div class="seg"><button data-set="fxMode=up" class="${mode === 'up' ? 'on' : ''}">Upcoming</button><button data-set="fxMode=res" class="${mode === 'res' ? 'on' : ''}">Results</button></div>
    <div class="chips"><button data-set="fxMine=all" class="${!mine ? 'on' : ''}">All games</button><button data-set="fxMine=mine" class="${mine ? 'on' : ''}">${esc(name(ME))}</button></div></div>
    ${body}${footer()}</div>`;
}

function pageMatch(id) {
  const m = BY[id];
  if (!m) return notFound();
  const s = sides(m), A = s.A, B = s.B;
  if (m.p) {
    return `<div class="page"><div class="cols"><div class="col">${hero(m, false)}${insightsCard(m.ins)}${card('Stats comparison', compareBars(A, B))}</div>
      <div class="col">${formCard(A, B)}${playersCard(A, B)}${commonCard(A, B)}${meetingsCard(A, B)}
      <a class="btn" href="#/compare/${A}/${B}" style="width:100%;justify-content:center;margin-bottom:14px">Compare ${AB[A]} and ${AB[B]} in detail</a></div></div>${footer()}</div>`;
  }
  // A played game.
  const played = m.kind === 'played';
  let verdictLine = '';
  if (m.pre && played) {
    const o = oddsAB(m, m.pre);
    const act = m.actual === 'd' ? 'D' : ((m.actual === 'h') === s.aHome ? 'A' : 'B');
    verdictLine = `<div class="vline">${m.upset ? `<span class="vtag upset">Upset</span>` : m.hit ? '<span class="vtag ok">✓ Model called it</span>' : '<span class="vtag miss">✗ Model missed it</span>'}
      <span class="muted">Before kick-off the model gave this result a ${pct(m.pre[m.actual])} chance.</span></div>${outcomeRows(A, B, o.pa, o.pd, o.pb, act)}`;
  } else if (!played) {
    verdictLine = '<p class="note">This game was a walkover, so it counts in the table but not in the ratings.</p>';
  } else {
    verdictLine = '<p class="note">Too early in the season for a pre-match prediction.</p>';
  }
  const sc = played ? `${m.hg}–${m.ag}` : (m.kind === 'walkover-H' ? 'H – W' : 'A – W');
  return `<div class="page"><div class="cols"><div class="col"><section class="card">
      <div class="m-meta"><span class="chip-s">${esc(D.division || 'League')}</span><span>${fdate(m.date, true)}</span><span>Full time</span></div>
      <div class="score-big"><a class="tm" href="#/team/${m.home}">${badge(m.home, 'lg')}<span>${esc(name(m.home))}</span></a>
        <div><div class="sc">${sc}</div>${m.ht ? `<span class="ht">HT ${m.ht[0]}–${m.ht[1]}</span>` : ''}</div>
        <a class="tm" href="#/team/${m.away}">${badge(m.away, 'lg')}<span>${esc(name(m.away))}</span></a></div>
      ${verdictLine}</section>${card('Stats comparison (today)', compareBars(A, B))}</div>
    <div class="col">${formCard(A, B)}${meetingsCard(A, B)}</div></div>${footer()}</div>`;
}

function tableRows(view) {
  let rows;
  if (view === 'home' || view === 'away') {
    rows = IDS.map(id => ({ id, r: T[id][view] })).sort((x, y) => (y.r.Pts - x.r.Pts) || (y.r.GD - x.r.GD) || (y.r.GF - x.r.GF));
  } else if (view === 'form') {
    rows = IDS.map(id => { const g = games(id).slice(-5); const r = { P: g.length, W: 0, D: 0, L: 0, GF: 0, GA: 0, Pts: 0 };
      g.forEach(x => { r[x.res]++; r.GF += x.gf; r.GA += x.ga; r.Pts += x.res === 'W' ? 3 : x.res === 'D' ? 1 : 0; }); r.GD = r.GF - r.GA; return { id, r }; })
      .sort((x, y) => (y.r.Pts - x.r.Pts) || (y.r.GD - x.r.GD));
  } else {
    rows = IDS.map(id => ({ id, r: T[id].row }));
  }
  return rows;
}
function pageTable() {
  const v = S.tbl, segs = [['all', 'Overall'], ['home', 'Home'], ['away', 'Away'], ['form', 'Form'], ['proj', 'Projected']];
  let head, body;
  if (v === 'proj') {
    const rows = IDS.slice().sort(by(id => T[id].sim ? T[id].sim.xp : 0, -1));
    head = `<tr><th>#</th><th class="l">Team</th><th>Pts</th><th>Proj</th><th>Top</th><th class="hxs">Top 3</th><th class="hs">Most likely</th></tr>`;
    body = rows.map((id, i) => { const t = T[id], s = t.sim; const fin = s ? s.fin : [];
      const top3 = fin.slice(0, 3).reduce((a, b) => a + b, 0), ml = fin.indexOf(Math.max(...fin)) + 1;
      return `<tr data-href="#/team/${id}" class="${id === ME ? 'me' : ''}"><td class="posn">${i + 1}</td><td class="l"><div class="tm">${badge(id, 'sm')}<span>${esc(t.name)}</span></div></td>
        <td>${t.row.Pts}</td><td class="pts">${s ? Math.round(s.xp) : '–'}</td><td>${s ? pct(fin[0]) : '–'}</td><td class="hxs">${s ? pct(top3) : '–'}<span class="minibar hs"><span style="width:${(top3 * 100).toFixed(0)}%"></span></span></td><td class="hs">${s ? ord(ml) : '–'}</td></tr>`; }).join('');
  } else {
    const rows = tableRows(v);
    head = `<tr><th>#</th>${v === 'all' ? '<th class="mv" title="Places moved in the last week"></th>' : ''}<th class="l">Team</th><th>P</th><th class="hs">W</th><th class="hs">D</th><th class="hs">L</th><th class="hxs">GF</th><th class="hxs">GA</th><th>GD</th><th>Pts</th>${v === 'all' ? '<th class="hs">Form</th>' : ''}</tr>`;
    body = rows.map((x, i) => { const r = x.r, t = T[x.id];
      return `<tr data-href="#/team/${x.id}" class="${x.id === ME ? 'me' : ''}"><td class="posn">${i + 1}</td>${v === 'all' ? `<td class="mv">${mvCell(movement(x.id))}</td>` : ''}<td class="l"><div class="tm">${badge(x.id, 'sm')}<span>${esc(t.name)}</span></div></td>
        <td>${r.P}</td><td class="hs">${r.W}</td><td class="hs">${r.D}</td><td class="hs">${r.L}</td><td class="hxs">${r.GF}</td><td class="hxs">${r.GA}</td><td>${r.GD > 0 ? '+' : ''}${r.GD}</td><td class="pts">${r.Pts}</td>
        ${v === 'all' ? `<td class="hs">${dotsHtml(t.form)}</td>` : ''}</tr>`; }).join('');
  }
  const mvMe = movement(ME);
  const notes = { all: `Worked out from results on Full-Time, so points deductions aren't included.${mvMe ? ` Arrows show places moved since ${fshort(mvMe.since)}.` : ''}`, home: 'Home games only.', away: 'Away games only.',
    form: 'Last 5 league games for each team.', proj: `Projected final points and finishing chances from simulating the rest of the season ${D.sims.toLocaleString()} times.` };
  return `<div class="page"><div class="page-h"><h1>Table</h1><p>Tap a team to see its ratings, games and players.</p>
    <div class="seg">${segs.map(([k, l]) => `<button data-set="tbl=${k}" class="${v === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    <section class="card"><div class="tbl-wrap"><table class="tbl"><thead>${head}</thead><tbody>${body}</tbody></table></div><p class="note">${notes[v]}</p></section>${footer()}</div>`;
}

function kpi(m, t) {
  const rk = t.rk[m.rk || m.k];
  return `<div class="kpi" title="${esc(m.info)}"><div class="k">${m.label}</div><div class="v"><b>${m.fmt(t[m.k])}</b>${rkPill(rk, m.k === 'sos_r' ? ord(rk) + ' hardest' : null)}</div></div>`;
}

function pageTeam(id) {
  const t = T[id]; if (!t) return notFound();
  const tab = S.teamTab, gs = games(id), fx = fixturesOf(id);
  const cmpWith = id === ME ? (BY[D.next] ? sides(BY[D.next]).B : IDS.find(x => x !== ME)) : ME;
  const head = `<section class="card"><div class="t-head">${badge(id, 'lg')}<div><h1>${esc(t.name)}</h1>
      <div class="t-sub">${ord(t.row.pos)} with ${t.row.Pts} points from ${t.row.P} games${mvText(movement(id))}</div></div></div>
    <div class="t-meta">${chipsHtml(t.form)}${t.streak ? `<span class="muted" style="font-size:13px">${esc(t.streak)}</span>` : ''}</div>
    <div class="t-actions"><a class="btn primary" href="#/compare/${ME}/${id === ME ? cmpWith : id}">${id === ME ? `Compare with ${esc(name(cmpWith))}` : `Compare with ${esc(name(ME))}`}</a>
    ${fx[0] ? `<a class="btn" href="#/match/${fx[0].id}">Next game</a>` : ''}</div>
    <div class="seg" style="margin:18px 0 0"><button data-set="teamTab=ov" class="${tab === 'ov' ? 'on' : ''}">Overview</button><button data-set="teamTab=games" class="${tab === 'games' ? 'on' : ''}">Games</button>
    <button data-set="teamTab=players" class="${tab === 'players' ? 'on' : ''}">Players</button></div></section>`;
  const tabs = '';
  let body = '';
  if (tab === 'ov') {
    const ratings = card('Ratings', `<div class="kpis">${METRICS.map(m => kpi(m, t)).join('')}</div>
      <details class="info"><summary>What do these mean?</summary><dl>${METRICS.map(m => `<dt>${m.label}</dt><dd>${m.info}</dd>`).join('')}</dl></details>`, 'rank of ' + N);
    const powerCh = t.pow_hist.length >= 2 ? card('Power rating over the season', lineChart({ labels: t.pow_hist.map(x => x.d), fmt: 'num', zero: true,
      series: [{ name: t.name, cls: id === ME ? 'a' : 'n', vals: t.pow_hist.map(x => x.v), area: true }], aria: 'Power rating over the season',
      note: 'Above the dashed line means better than an average team. Each point uses only the results known at the time.' })) : '';
    const posCh = t.pos_hist.length >= 2 ? card('League position', lineChart({ labels: t.pos_hist.map(x => x.d), fmt: 'pos',
      series: [{ name: t.name, cls: id === ME ? 'a' : 'n', vals: t.pos_hist.map(x => x.pos) }], aria: 'League position after each matchday' })) : '';
    const s = t.sim;
    const proj = s ? card('Projected finish', `<div class="big-stat"><div><b>${Math.round(s.xp)}</b><span>Projected points</span></div><div><b>${pct(s.fin[0])}</b><span>Win the league</span></div>
      <div><b>${pct(s.fin.slice(0, 3).reduce((a, b) => a + b, 0))}</b><span>Top 3</span></div><div><b>${ord(s.fin.indexOf(Math.max(...s.fin)) + 1)}</b><span>Most likely</span></div></div>
      ${finishChart(s.fin, id === ME)}<p class="note">Chance of finishing in each position, from ${D.sims.toLocaleString()} simulations of the rest of the season. Tap a bar for the number.</p>`) : '';
    const sp = (lab, x) => x ? `<div class="split"><h4>${lab}</h4><div class="kv"><span>Record</span><b>W${x.W} D${x.D} L${x.L}</b></div><div class="kv"><span>Pts / game</span><b>${x.ppg.toFixed(2)}</b></div>
      <div class="kv"><span>Scored / game</span><b>${x.gf.toFixed(1)}</b></div><div class="kv"><span>Conceded / game</span><b>${x.ga.toFixed(1)}</b></div>
      <div class="kv"><span>Clean sheets</span><b>${pct(x.cs)}</b></div><div class="kv"><span>Scored 2+</span><b>${pct(x.scored2)}</b></div></div>` : `<div class="split"><h4>${lab}</h4><div class="muted">No games yet</div></div>`;
    const splits = card('Home & away', `<div class="splits">${sp('Home', t.split.home)}${sp('Away', t.split.away)}</div>`);
    const h = t.ht;
    const ht = h ? card('Half-time patterns', `<div class="kpis">
        <div class="kpi"><div class="k">Ahead at HT</div><div class="v"><b>${h.lead.n ? `${h.lead.W}-${h.lead.D}-${h.lead.L}` : '–'}</b></div></div>
        <div class="kpi"><div class="k">Level at HT</div><div class="v"><b>${h.level.n ? `${h.level.W}-${h.level.D}-${h.level.L}` : '–'}</b></div></div>
        <div class="kpi"><div class="k">Behind at HT</div><div class="v"><b>${h.behind.n ? `${h.behind.W}-${h.behind.D}-${h.behind.L}` : '–'}</b></div></div>
        <div class="kpi"><div class="k">1st-half goals</div><div class="v"><b>${h.f1}–${h.a1}</b></div></div>
        <div class="kpi"><div class="k">2nd-half goals</div><div class="v"><b>${h.f2}–${h.a2}</b></div></div>
        <div class="kpi"><div class="k">Pts won from behind</div><div class="v"><b>${h.pts_behind}</b></div></div></div>
      <p class="note">From the ${h.n} of ${h.total} games where a half-time score was entered. Records are won-drawn-lost; goals are for–against.</p>`) : '';
    body = `<div class="cols"><div class="col">${ratings}${powerCh}${posCh}</div><div class="col">${proj}${splits}${ht}</div></div>`;
  } else if (tab === 'games') {
    const hardest = fx.slice(0, 8).reduce((hh, x) => { const p = x.home === id ? x.p.h : x.p.a; return (!hh || p < hh.p) ? { x, p } : hh; }, null);
    const up = fx.length ? `<div class="mkts">${fx.map(x => fxCard(x, { hl: id !== ME, flag: hardest && hardest.x === x ? 'Toughest' : '' })).join('')}</div>` : '<div class="empty">No more fixtures scheduled.</div>';
    const called = gs.filter(g => g.r.pre), hits = called.filter(g => g.r.hit).length;
    body = `<div class="cols"><div class="col">${card('Results', gameRows(gs, id) + (called.length ? `<p class="note">"Given" = ${esc(t.name)}'s chance of winning before kick-off. The model called ${hits} of ${called.length} of their results.</p>` : ''), `${gs.length} played`)}</div>
      <div class="col">${card('Upcoming', up, `${fx.length} scheduled`)}</div></div>`;
  } else {
    const p = t.players;
    body = p.length ? card('Players', `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="l">Player</th><th>Apps</th><th>Goals</th><th>Assists</th><th>Cards</th></tr></thead><tbody>
      ${p.map(x => `<tr><td class="l">${esc(x.n)}</td><td>${x.apps}</td><td class="pts">${x.g || ''}</td><td>${x.a || ''}</td><td>${x.y ? `<span class="bk y"></span>${x.y > 1 ? x.y : ''}` : ''}${x.r ? `<span class="bk r"></span>${x.r > 1 ? x.r : ''}` : ''}</td></tr>`).join('')}</tbody></table></div>
      <p class="note">All competitions, as entered by the club on Full-Time. Some clubs don't record every scorer.</p>`, `${p.length} used`)
      : card('Players', '<div class="empty">No player stats on Full-Time for this team yet.</div>');
  }
  return `<div class="page">${head}${tabs}${body}${footer()}</div>`;
}

function pageCompare(a, b) {
  if (!T[a] || !T[b]) return notFound();
  const opts = sel => IDS.map(id => `<option value="${id}" ${id === sel ? 'selected' : ''}>${esc(name(id))}</option>`).join('');
  const fxAB = FX.find(f => (f.home === a && f.away === b)), fxBA = FX.find(f => (f.home === b && f.away === a));
  const venueBox = (h, aw, f) => {
    const p = f ? f.p : predict(h, aw);
    const pa = h === a ? p.h : p.a, pb = h === a ? p.a : p.h;
    return `<div class="split"><h4>At ${esc(name(h))}${f ? ` <span class="muted" style="font-weight:500">${fdate(f.date)}</span>` : ''}</h4>
      <div class="mini3"><div class="a" style="flex:${pa.toFixed(3)}">${pct(pa)}</div><div class="d" style="flex:${p.d.toFixed(3)}">${pct(p.d)}</div><div class="b" style="flex:${pb.toFixed(3)}">${pct(pb)}</div></div>
      <div class="mini3-l"><span>${AB[a]} win</span><span>Draw</span><span>${AB[b]} win</span></div>${f ? `<a class="more" href="#/match/${f.id}">Open match page</a>` : ''}</div>`;
  };
  const ta = T[a], tb = T[b];
  const align = (h1, h2, key) => { const ds = Array.from(new Set(h1.map(x => x.d).concat(h2.map(x => x.d)))).sort();
    const m1 = Object.fromEntries(h1.map(x => [x.d, x[key]])), m2 = Object.fromEntries(h2.map(x => [x.d, x[key]])); return { ds, v1: ds.map(d => m1[d] ?? null), v2: ds.map(d => m2[d] ?? null) }; };
  const pw = align(ta.pow_hist, tb.pow_hist, 'v'), ps = align(ta.pos_hist, tb.pos_hist, 'pos');
  return `<div class="page"><div class="page-h"><h1>Compare</h1><p>Pick any two teams.</p></div>
    <section class="card"><div class="pickers"><select class="pa" data-cmp="a" aria-label="First team">${opts(a)}</select><span class="vs">vs</span><select class="pb" data-cmp="b" aria-label="Second team">${opts(b)}</select></div></section>
    ${a === b ? card('', '<div class="empty">Pick two different teams.</div>') : `<div class="cols"><div class="col">
      ${card('If they played', `<div class="duo">${venueBox(a, b, fxAB)}${venueBox(b, a, fxBA)}</div>`)}
      ${card('Stats comparison', compareBars(a, b))}
      ${pw.ds.length >= 2 ? card('Power rating over the season', lineChart({ labels: pw.ds, fmt: 'num', zero: true, series: [{ name: ta.name, cls: 'a', vals: pw.v1 }, { name: tb.name, cls: 'b', vals: pw.v2 }], aria: 'Power ratings over the season' })) : ''}
    </div><div class="col">
      ${ps.ds.length >= 2 ? card('League position', lineChart({ labels: ps.ds, fmt: 'pos', series: [{ name: ta.name, cls: 'a', vals: ps.v1 }, { name: tb.name, cls: 'b', vals: ps.v2 }], aria: 'League position over the season' })) : ''}
      ${formCard(a, b)}${commonCard(a, b)}${meetingsCard(a, b)}
    </div></div>`}${footer()}</div>`;
}

function board(key, title, rows, opts = {}) {
  const open = S.statsOpen[key];
  const show = opts.show || 5;
  const items = rows.map((r, i) => {
    const t = r.id ? T[r.id] : null;
    const inner = `<span class="n">${i + 1}</span><span class="t">${r.id ? badge(r.id, 'sm') : ''}<span>${esc(r.label || t.name)}${r.sub ? `<small>${r.sub}</small>` : ''}</span></span><span class="v">${r.extra || ''}${r.v}</span>`;
    const cls = `lb-row ${i >= show ? 'extra' : ''} ${r.id === ME ? 'me' : ''}`;
    return r.href || r.id ? `<a class="${cls}" href="${r.href || '#/team/' + r.id}">${inner}</a>` : `<div class="${cls}">${inner}</div>`;
  }).join('');
  const more = rows.length > show ? `<button class="lb-more" data-lb="${key}"><span class="hide-open">Show all ${rows.length}</span><span class="show-open">Show fewer</span></button>` : '';
  const info = opts.info ? `<details class="info"><summary>How it's worked out</summary><p>${opts.info}</p></details>` : '';
  return `<section class="card lb ${open ? 'open' : ''}" data-key="${key}"><div class="card-h"><h3>${title}</h3>${opts.aside ? `<span class="aside">${opts.aside}</span>` : ''}</div>
    ${rows.length ? items : '<div class="empty">Nothing yet.</div>'}${more}${info}</section>`;
}
function pageStats() {
  const sorted = (f, dir = -1) => IDS.slice().sort(by(id => f(T[id]), dir));
  const M = k => METRICS.find(m => m.k === k);
  const boards = [];
  boards.push(board('power', 'Power rankings', sorted(t => t.power).map(id => ({ id, v: sgn(T[id].power, 2), sub: `${ord(T[id].row.pos)} in the table` })), { info: M('power').info, show: 6 }));
  boards.push(board('form', 'In form', sorted(t => t.formr).map(id => ({ id, v: sgn(T[id].formr, 1), extra: dotsHtml(T[id].form) })), { info: M('formr').info }));
  boards.push(board('att', 'Best attack', sorted(t => t.att).map(id => ({ id, v: T[id].att.toFixed(2), sub: T[id].split.all ? `${T[id].split.all.gf.toFixed(1)} goals a game` : '' })), { info: M('att').info }));
  boards.push(board('def', 'Best defence', sorted(t => t.def).map(id => ({ id, v: T[id].def.toFixed(2), sub: T[id].split.all ? `${T[id].split.all.ga.toFixed(1)} conceded a game` : '' })), { info: M('def').info }));
  boards.push(board('luck', 'Points vs expected', sorted(t => t.luck).map(id => ({ id, v: sgn(T[id].luck, 1), sub: `${T[id].apts} won, ${T[id].xpts.toFixed(1)} expected` })), { info: M('luck').info, aside: 'luckiest first' }));
  boards.push(board('sos', 'Toughest run-in', sorted(t => t.sos_r).map(id => ({ id, v: sgn(T[id].sos_r, 2), sub: `${T[id].n_rem} games left` })), { info: M('sos_r').info }));
  const ups = RES.filter(r => r.upset).sort(by(r => r.pre[r.actual]));
  boards.push(board('upsets', 'Biggest upsets', ups.map(r => { const w = r.actual === 'h' ? r.home : r.away, l = r.actual === 'h' ? r.away : r.home;
    return { id: w, href: `#/match/${r.id}`, label: `${name(w)} ${r.actual === 'h' ? `${r.hg}–${r.ag}` : `${r.ag}–${r.hg}`} ${name(l)}`, sub: fdate(r.date), v: pct(r.pre[r.actual]) }; }),
    { info: 'Wins the model gave less than a 30% chance of happening before kick-off.', aside: 'chance given' }));
  if (D.has_players) {
    boards.push(board('scorers', 'Top scorers', D.scorers.filter(p => p.g).map(p => ({ id: p.team, label: p.n, sub: `${name(p.team)}, ${p.apps} apps`, v: p.g })),
      { info: 'All competitions, as entered by clubs on Full-Time. Clubs that don\'t record scorers won\'t appear.', show: 8 }));
    const ast = D.scorers.filter(p => p.a).sort(by(p => p.a, -1));
    if (ast.length) boards.push(board('assists', 'Most assists', ast.map(p => ({ id: p.team, label: p.n, sub: name(p.team), v: p.a }))));
    boards.push(board('cards', 'Discipline', IDS.filter(id => T[id].has_players).sort(by(id => T[id].cards.y + 3 * T[id].cards.r, -1))
      .map(id => ({ id, v: `<span class="bk y"></span>${T[id].cards.y}${T[id].cards.r ? `<span class="bk r"></span>${T[id].cards.r}` : ''}` })), { info: 'Cards recorded on Full-Time in all competitions. Most booked first.', aside: 'most cards first' }));
  }
  const htTeams = IDS.filter(id => T[id].ht);
  if (htTeams.length) boards.push(board('comeback', 'Comeback kings',
    htTeams.sort(by(id => T[id].ht.pts_behind, -1)).map(id => ({ id, v: `${T[id].ht.pts_behind} pts`, sub: `${T[id].ht.behind.n} games behind at HT` })),
    { info: 'Points won from games they were losing at half-time. Only games with a half-time score on Full-Time.' }));
  boards.push(board('cs', 'Clean sheets', sorted(t => t.split.all ? t.split.all.cs : 0).map(id => ({ id, v: pct(T[id].split.all ? T[id].split.all.cs : 0) }))));
  const sc = D.scorecard;
  const model = sc ? card('How good is the model?', `<div class="big-stat"><div><b>${pct(sc.hits / sc.n)}</b><span>Results called right</span></div><div><b>${sc.hits}/${sc.n}</b><span>Games tested</span></div>
      <div><b>${pct(sc.home / sc.n)}</b><span>Always backing home</span></div>${sc.conf_n ? `<div><b>${sc.conf_hits}/${sc.conf_n}</b><span>When 60%+ confident</span></div>` : ''}</div>
      <p class="note">Every game is re-predicted using only the results from before that day, the same way upcoming games are predicted, so it's a fair test.</p>
      <a class="more" href="#/fixtures" data-set="fxMode=res">See every result with its prediction</a>`) : '';
  return `<div class="page"><div class="page-h"><h1>Stats</h1><p>Division leaderboards. Tap any team for more.</p></div>
    <a class="card cmp-link" href="#/compare/${ME}/${BY[D.next] ? sides(BY[D.next]).B : IDS.find(x => x !== ME)}">
      <span class="cm-ic"><svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></span><span style="flex:1"><b>Compare two teams</b><span class="muted" style="display:block;font-size:13px">Ratings, odds, form and history side by side</span></span></a>
    ${model}<div class="grid-cards three">${boards.join('')}</div>${footer()}</div>`;
}

function notFound() {
  return `<div class="page">${card('', '<div class="empty">That page isn\'t in this week\'s data. <a class="tl" href="#/">Go to the next match</a></div>')}</div>`;
}
function footer() {
  return `<footer class="foot">Data from FA Full-Time: ${D.n_results} league results, updated ${updText()}. Odds come from a goals model fitted to every result in the division, weighted towards recent games. It knows nothing about who's available on the day.</footer>`;
}


/* ================= cup ================= */
const CUP = D.cup || { cups: [], other: [] };
const cupTie = id => { for (const c of CUP.cups) for (const col of c.columns.concat(c.prelim.map(p => ({ ties: p.ties })))) for (const t of col.ties) if (t && t.id === id) return t; for (const o of CUP.other) for (const t of o.run) if (t.id === id) return t; return null; };
const tname = (t, side) => { const id = side === 'h' ? t.h_id : t.a_id, nm = side === 'h' ? t.home : t.away; return id ? `<a class="tl" href="#/team/${id}">${esc(nm)}</a>` : esc(nm); };
function tieResultFor(t) {
  const home = t.home === name(ME), gf = home ? t.hg : t.ag, ga = home ? t.ag : t.hg;
  const won = (t.winner === 'h') === home;
  return { home, opp: home ? t.away : t.home, oppId: home ? t.a_id : t.h_id, gf, ga, won, res: t.winner ? (won ? 'W' : 'L') : (gf === ga ? 'D' : gf > ga ? 'W' : 'L') };
}
function scoreText(t, side) {
  if (t.status !== 'played') return '';
  if (t.kind === 'walkover-H') return side === 'h' ? 'W' : '–';
  if (t.kind === 'walkover-A') return side === 'a' ? 'W' : '–';
  return side === 'h' ? t.hg : t.ag;
}
function tieMeta(t) {
  if (t.status === 'upcoming') return fdate(t.date, true);
  if (t.kind && t.kind.startsWith('walkover')) return 'Walkover';
  return `Full time${t.aet ? ', after extra time' : ''}${t.pens ? `, pens ${t.pens[0]}–${t.pens[1]}` : ''}`;
}

function bracketHtml(cup, start) {
  const cols = cup.columns.slice(start);
  if (!cols.length) return '';
  const narrow = window.innerWidth < 560;
  const BW = narrow ? 172 : 214, BH = 76, GX = narrow ? 28 : 40, GY = 12, HEAD = 34;
  const U = BH + GY, n0 = cols[0].ties.length;
  const W = cols.length * BW + (cols.length - 1) * GX, H = HEAD + n0 * U;
  const pos = (c, i) => ({ x: c * (BW + GX), y: HEAD + (i + 0.5) * U * Math.pow(2, c) - BH / 2 });
  let boxes = '', lines = '', heads = '';
  cols.forEach((col, c) => {
    heads += `<div class="br-h ${col.future ? 'fut' : ''}" style="left:${c * (BW + GX)}px;width:${BW}px">${esc(col.name)}${col.future ? '<span>draw to come</span>' : ''}</div>`;
    col.ties.forEach((t, i) => {
      const p = pos(c, i);
      if (!t) {
        boxes += `<div class="bx empty ${col.future ? 'fut' : ''}" style="left:${p.x}px;top:${p.y}px;width:${BW}px;height:${BH}px"><span>${col.future ? 'Draw TBC' : 'Bye'}</span></div>`;
      } else {
        const row = side => {
          const nm = side === 'h' ? t.home : t.away, isMe = nm === name(ME), win = t.winner === side, lose = t.winner && !win;
          const right = t.status === 'upcoming' ? (t.p ? `<span class="bx-p">${pct(side === 'h' ? t.p.h : t.p.a)}</span>` : '') : `<span class="bx-s">${scoreText(t, side)}</span>`;
          return `<div class="bx-r ${win ? 'win' : ''} ${lose ? 'lose' : ''} ${isMe ? 'me' : ''}"><span class="bx-n">${tname(t, side)}</span>${right}</div>`;
        };
        boxes += `<div class="bx ${t.mine ? 'mine' : ''} ${t.status}" style="left:${p.x}px;top:${p.y}px;width:${BW}px;height:${BH}px">
          <div class="bx-m">${tieMeta(t)}</div>${row('h')}${row('a')}</div>`;
      }
      if (c > 0) {
        const kids = [cols[c - 1].ties[2 * i], cols[c - 1].ties[2 * i + 1]];
        kids.forEach((k, j) => {
          const a = pos(c - 1, 2 * i + j), x1 = a.x + BW, y1 = a.y + BH / 2, x2 = p.x, y2 = p.y + BH / 2, xm = x1 + GX / 2;
          const meWon = k && k.mine && t && t.mine;
          lines += `<path d="M${x1},${y1} H${xm} V${y2} H${x2}" class="${col.future ? 'fut' : ''} ${meWon ? 'me' : ''}"/>`;
        });
      }
    });
  });
  return `<div class="br-scroll"><div class="br" style="width:${W}px;height:${H}px">${heads}
    <svg class="br-lines" width="${W}" height="${H}" aria-hidden="true">${lines}</svg>${boxes}</div></div>`;
}

function runList(run) {
  if (!run.length) return '<div class="empty">No games yet.</div>';
  return `<ul class="games cup-run">${run.map(t => {
    const r = tieResultFor(t);
    const opp = r.oppId ? `<a class="tl" href="#/team/${r.oppId}">${esc(r.opp)}</a>` : esc(r.opp);
    const right = t.status === 'upcoming' ? `<span class="gv">${fdate(t.date)}</span><span class="gs"></span>`
      : `<span class="gv">${t.pens ? `pens ${r.home ? t.pens[0] : t.pens[1]}–${r.home ? t.pens[1] : t.pens[0]}` : t.kind.startsWith('walkover') ? 'walkover' : ''}</span><span class="gs">${t.kind.startsWith('walkover') ? '' : `${r.gf}–${r.ga}`}</span>`;
    return `<li><div class="row"><span class="chip ${t.status === 'upcoming' ? 'N' : r.res}">${t.status === 'upcoming' ? '' : r.res}</span><span class="dt">${esc(t.round)}</span>
      <span class="op">${opp} <i>(${r.home ? 'H' : 'A'})</i></span>${right}</div></li>`;
  }).join('')}</ul>`;
}

function statusCard(cup) {
  const s = cup.status, t = s.tie ? cupTie(s.tie) : null;
  let head = '', body = '';
  if (s.state === 'next' && t) {
    const r = tieResultFor(t);
    const odds = t.p ? (() => { const pa = r.home ? t.p.h : t.p.a, pb = r.home ? t.p.a : t.p.h, v = verdict(pa, pb);
      return `<div class="vline" style="margin-top:12px">${vTag(v, ME, r.oppId)}<span class="muted">${esc(name(ME))} ${pct(pa)}, draw ${pct(t.p.d)}, ${esc(r.opp)} ${pct(pb)} (before extra time and penalties).</span></div>`; })()
      : `<p class="note">${esc(r.opp)} play outside ${esc(D.division || 'your division')}, so the model can't price this one.</p>`;
    head = `<span class="vtag good">Still in it</span><h2 class="cup-h">Into the ${esc(s.round)}</h2>`;
    body = `<div class="next-tie"><div class="nt-when">${fdate(t.date, true)}${t.venue ? `, ${esc(t.venue)}` : ''}</div>
      <div class="nt-t">${r.home ? 'v' : 'at'} ${r.oppId ? `<a class="tl" href="#/team/${r.oppId}">${esc(r.opp)}</a>` : esc(r.opp)}</div></div>${odds}`;
  } else if (s.state === 'out' && t) {
    const r = tieResultFor(t);
    head = `<span class="vtag miss">Knocked out</span><h2 class="cup-h">Out in the ${esc(s.round)}</h2>`;
    body = `<p class="muted" style="margin:6px 0 0">Lost ${r.gf}–${r.ga}${t.pens ? ` (pens ${r.home ? t.pens[0] : t.pens[1]}–${r.home ? t.pens[1] : t.pens[0]})` : ''} ${r.home ? 'v' : 'at'} ${esc(r.opp)}, ${fdate(t.date)}.</p>`;
  } else if (s.state === 'through') {
    head = `<span class="vtag good">Still in it</span><h2 class="cup-h">Through to the ${esc(s.next_round || 'next round')}</h2>`;
    body = '<p class="muted" style="margin:6px 0 0">Waiting for the draw.</p>';
  } else if (s.state === 'won') {
    head = `<span class="vtag ok">🏆 Winners</span><h2 class="cup-h">${esc(cup.name)} winners</h2>`;
  } else {
    head = `<h2 class="cup-h">${esc(cup.name)}</h2>`;
  }
  return `<section class="card cup-status"><div class="m-meta"><span class="chip-s">${esc(cup.name)}</span>${cup.n_teams ? `<span>${cup.n_teams} teams</span>` : ''}</div>${head}${body}
    <div class="card-h" style="margin:16px 0 4px"><h3>Your cup run</h3></div>${runList(cup.run)}</section>`;
}

const S2 = { cupIdx: 0, cupStart: null };
function pageCup() {
  if (!CUP.cups.length && !CUP.other.length) {
    return `<div class="page"><div class="page-h"><h1>Cup</h1></div>${card('', '<div class="empty">No cup games found for this season yet.</div>')}${footer()}</div>`;
  }
  const ci = Math.min(S2.cupIdx, Math.max(0, CUP.cups.length - 1)), cup = CUP.cups[ci];
  const tabs = CUP.cups.length > 1 ? `<div class="seg">${CUP.cups.map((c, i) => `<button data-cup="${i}" class="${i === ci ? 'on' : ''}">${esc(c.name)}</button>`).join('')}</div>` : '';
  let main = '';
  if (cup) {
    const real = cup.columns.map((c, i) => ({ c, i })).filter(x => !x.c.future);
    const current = (cup.columns.findIndex(c => !c.future && c.ties.some(t => t && t.status === 'upcoming')) + 1 || real.length) - 1;
    const def = Math.max(0, current < 0 ? real.length - 1 : current);
    const start = S2.cupStart == null ? def : Math.min(S2.cupStart, cup.columns.length - 1);
    const chips = real.length > 1 ? `<div class="chips">${real.map(x => `<button data-cupstart="${x.i}" class="${x.i === start ? 'on' : ''}">From ${esc(x.c.name)}</button>`).join('')}</div>` : '';
    main = `<section class="card"><div class="card-h"><h3>The knockout</h3><span class="aside">${window.innerWidth < 900 ? 'Swipe for later rounds' : ''}</span></div>${chips}${bracketHtml(cup, start)}
      <p class="note">Your path is in blue. Later rounds are drawn after each round, so the empty boxes aren't fixed match-ups yet.${cup.columns.some(c => c.ties.some(t => t && t.p)) ? ' Percentages show the model\'s win chance where both teams are in ' + esc(D.division) + '.' : ''}</p></section>
      ${cup.prelim.map(p => `<details class="card fold-card"><summary><h3>${esc(p.name)}</h3><span class="sum-tag">${p.ties.length} ties</span></summary>
        <div class="mkts" style="margin-top:12px">${p.ties.map(t => `<div class="mkt ${t.mine ? 'mine' : ''}"><div class="mkt-h"><span class="mkt-date">${tieMeta(t)}</span></div>
          <div class="mkt-t"><span class="nm ${t.winner === 'h' ? 'w' : ''}">${tname(t, 'h')}</span><i>vs</i><span class="nm ${t.winner === 'a' ? 'w' : ''}">${tname(t, 'a')}</span>
          <span class="sc">${t.status === 'played' ? (t.kind.startsWith('walkover') ? 'W/O' : `${t.hg}–${t.ag}`) : ''}</span></div></div>`).join('')}</div></details>`).join('')}`;
  }
  const others = CUP.other.map(o => {
    const s = o.status, t = s.tie ? cupTie(s.tie) : null, r = t ? tieResultFor(t) : null;
    const line = s.state === 'out' && r ? `<span class="vtag miss">Knocked out</span> <span class="muted">lost ${r.gf}–${r.ga} ${r.home ? 'v' : 'at'} ${esc(r.opp)}</span>`
      : s.state === 'next' && r ? `<span class="vtag good">Next</span> <span class="muted">${r.home ? 'v' : 'at'} ${esc(r.opp)}, ${fdate(t.date, true)}</span>`
      : s.state === 'through' ? '<span class="vtag good">Through</span> <span class="muted">waiting for the next round</span>' : '';
    return card(esc(o.name), `<div class="vline" style="margin:0 0 10px">${line}</div>${runList(o.run)}<p class="note">County cup: only your own games are shown.</p>`);
  }).join('');
  return `<div class="page"><div class="page-h"><h1>Cup</h1><p>${cup ? `${esc(cup.name)} knockout and your cup runs.` : 'Your cup runs.'}</p></div>${tabs}
    <div class="cup-grid"><div class="ca-status">${cup ? statusCard(cup) : ''}</div><div class="ca-bracket">${main}</div><div class="ca-other">${others}</div></div>${footer()}</div>`;
}

function nextCupCard() {
  const all = CUP.cups.concat(CUP.other);
  for (const c of all) {
    if (c.status && c.status.state === 'next') {
      const t = cupTie(c.status.tie); if (!t) continue;
      const r = tieResultFor(t);
      return `<a class="card cup-mini" href="#/cup"><div class="cm-ic"><svg viewBox="0 0 24 24"><path d="M7.5 4h9v5.5a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 6.5H5a2.5 2.5 0 0 0 2.6 3.4M16.5 6.5H19a2.5 2.5 0 0 1-2.6 3.4M12 14v3.5M8.5 20.5h7M9.5 17.5h5"/></svg></div>
        <div style="flex:1;min-width:0"><div class="muted" style="font-size:12.5px">Next cup tie, ${esc(c.name)} ${esc(t.round.toLowerCase())}</div>
        <div style="font-weight:700">${r.home ? 'v' : 'at'} ${esc(r.opp)}</div><div class="muted" style="font-size:12.5px">${fdate(t.date, true)}</div></div></a>`;
    }
  }
  return '';
}

/* ================= routing ================= */
const view = document.getElementById('view');
const appbar = document.getElementById('appbar');
const scrollMem = {};
let current = null, navDepth = 0;

function resolve() {
  const h = location.hash || '#/';
  let m;
  if ((m = h.match(/^#\/match\/(\w+)/))) { const x = BY[m[1]]; return { tab: 'fixtures', detail: true, title: x ? `${AB[x.home]} vs ${AB[x.away]}` : 'Match', html: () => pageMatch(m[1]) }; }
  if ((m = h.match(/^#\/team\/([\w-]+)/))) return { tab: 'table', detail: true, title: T[m[1]] ? T[m[1]].name : 'Team', html: () => pageTeam(m[1]), key: 'team:' + m[1] };
  if ((m = h.match(/^#\/compare\/([\w-]+)\/([\w-]+)/))) return { tab: 'stats', detail: true, title: 'Compare', html: () => pageCompare(m[1], m[2]) };
  if (h.startsWith('#/fixtures')) return { tab: 'fixtures', title: 'Fixtures', html: pageFixtures };
  if (h.startsWith('#/table')) return { tab: 'table', title: 'Table', html: pageTable };
  if (h.startsWith('#/stats')) return { tab: 'stats', title: 'Stats', html: pageStats };
  if (h.startsWith('#/cup')) return { tab: 'cup', title: 'Cup', html: pageCup };
  return { tab: 'home', title: 'Next match', html: pageHome };
}

let lastTeam = null;
function render(keepScroll) {
  const r = resolve();
  if (r.key && r.key !== lastTeam) { S.teamTab = 'ov'; }
  lastTeam = r.key || lastTeam;
  for (const k in CH) delete CH[k];
  const back = r.detail ? `<button class="back-inline" data-back><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Back</button>` : '';
  view.innerHTML = back + r.html();
  drawCharts();
  if (ANIM.ok && r.tab === 'home') countUp(view.querySelector('.hero .big[data-count]'));
  ANIM.ok = false;
  document.querySelectorAll('.nav a[data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === r.tab));
  appbar.classList.toggle('detail', !!r.detail);
  document.getElementById('bar-title').textContent = r.detail ? r.title : '';
  document.title = `${r.title} | Match Stats`;
  if (!keepScroll) window.scrollTo(0, scrollMem[location.hash] || 0);
  current = location.hash;
  hideTip();
}

function countUp(el) {
  if (!el) return;
  const end = +el.dataset.count, t0 = performance.now(), dur = 900;
  const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(end * e) + '%'; if (k < 1) requestAnimationFrame(step); };
  el.textContent = '0%'; requestAnimationFrame(step);
}
function goBack() { if (navDepth > 0) history.back(); else location.hash = '#/'; }

window.addEventListener('hashchange', () => { if (current != null) scrollMem[current] = window.scrollY; navDepth++; render(false); });
document.getElementById('back').addEventListener('click', goBack);

document.addEventListener('click', e => {
  if (e.target.closest('[data-back]')) { goBack(); return; }
  const set = e.target.closest('[data-set]');
  if (set) {
    const [k, v] = set.dataset.set.split('=');
    S[k] = v;
    if (set.tagName === 'A') return; // link also navigates; render happens on hashchange
    e.preventDefault(); render(true); return;
  }
  const cb = e.target.closest('[data-cup]');
  if (cb) { S2.cupIdx = +cb.dataset.cup; S2.cupStart = null; render(true); return; }
  const cs = e.target.closest('[data-cupstart]');
  if (cs) { S2.cupStart = +cs.dataset.cupstart; render(true); return; }
  const lb = e.target.closest('[data-lb]');
  if (lb) { const k = lb.dataset.lb; S.statsOpen[k] = !S.statsOpen[k]; lb.closest('.lb').classList.toggle('open', S.statsOpen[k]); return; }
  const tr = e.target.closest('tr[data-href]');
  if (tr && !e.target.closest('a')) { location.hash = tr.dataset.href; }
});
document.addEventListener('change', e => {
  const s = e.target.closest('select[data-cmp]');
  if (!s) return;
  const a = document.querySelector('select[data-cmp="a"]').value, b = document.querySelector('select[data-cmp="b"]').value;
  history.replaceState(null, '', `#/compare/${a}/${b}`);
  render(true);
});

/* ================= tooltips ================= */
const tip = document.getElementById('tip');
function showTip(html, x, y) {
  tip.innerHTML = html; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = clamp(x - w / 2, 8, window.innerWidth - w - 8) + 'px';
  tip.style.top = (y - h - 10 < 8 ? y + 18 : y - h - 10) + 'px';
}
function hideTip() {
  tip.hidden = true;
  document.querySelectorAll('svg.lc .xh').forEach(l => l.setAttribute('visibility', 'hidden'));
}
function chartHover(svg, e) {
  const c = CH[svg.id]; if (!c) return; const o = c.o;
  const rc = svg.getBoundingClientRect(), W = +svg.dataset.w, L = +svg.dataset.l, R = +svg.dataset.r, n = o.labels.length;
  const sx = (e.clientX - rc.left) / rc.width * W;
  const i = n === 1 ? 0 : clamp(Math.round((sx - L) / (W - L - R) * (n - 1)), 0, n - 1);
  const x = n === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (n - 1);
  const xh = svg.querySelector('.xh'); xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
  const rows = o.series.map(s => s.vals[i] == null ? '' : `<div><i class="${s.cls}"></i>${esc(s.name)} <b style="display:inline">${FMT[o.fmt](s.vals[i])}</b></div>`).join('');
  showTip(`<b>${fdate(o.labels[i])}</b>${rows}`, rc.left + x / W * rc.width, rc.top);
}
function onPointer(e) {
  const el = e.target;
  if (!el || !el.closest) return;
  const svg = el.closest('svg.lc');
  if (svg) { chartHover(svg, e); return; }
  const t = el.closest('[data-tip]');
  if (t) { const rc = t.getBoundingClientRect(); showTip(t.dataset.tip, rc.left + rc.width / 2, rc.top); return; }
  if (!tip.hidden) hideTip();
}
document.addEventListener('pointermove', onPointer);
document.addEventListener('pointerdown', onPointer);
window.addEventListener('scroll', () => { if (!tip.hidden) hideTip(); }, { passive: true });

/* ================= go ================= */
const upd = `<span class="dot-live"></span>Updated ${updText()}`;
document.getElementById('upd').innerHTML = upd;
document.getElementById('upd-side').innerHTML = upd;
render(false);
})();
</script>
</body>
