<style>/* =========================================================
   Match Stats: market-style odds for a Magpies dev side.
   Ink black = Dereham, orange = the other side, grey = draw.
   Green / red only ever mean a won / lost result.
   ========================================================= */
:root{
  --bg:#eef0f2;        /* phone: the gaps between sections */
  --surface:#ffffff;
  --soft:#f4f5f7;
  --hover:#eceef1;
  --ink:#17191c;
  --muted:#6b7380;
  --line:#e5e7ea;
  --a:#000000;  --a-soft:#eceef0;  --a-on:#ffffff;   /* Dereham */
  --b:#e8590c;  --b-soft:#fdeee5;                     /* opponent */
  --draw:#8a929c; --draw-soft:#eff1f3;
  --w:#1e9e5a; --d:#9aa3ae; --l:#dc3b26; --good:#17834a; --bad:#c9341f;
  --upset:#a86b00; --upset-soft:#fff4d6;
  --stripe-a:#000; --stripe-b:#fff;
  --r-panel:18px; --r-tile:12px; --r-chip:8px;
  --disp:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1820; --surface:#18232e; --soft:#213040; --hover:#293a4c; --ink:#eef2f6; --muted:#8e9fb1; --line:#2a3a4a;
  --a:#ffffff; --a-soft:rgba(255,255,255,.10); --a-on:#0f1820;
  --b:#e8631f; --b-soft:rgba(232,99,31,.17);
  --draw:#7f8a99; --draw-soft:rgba(143,161,180,.13);
  --w:#38b26a; --d:#7f8a99; --l:#e5533d; --good:#4cc47a; --bad:#ff7a63;
  --upset:#f5c518; --upset-soft:rgba(245,197,24,.14);
  --stripe-a:#fff; --stripe-b:#18232e;
}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--disp);font-stretch:100%;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
b,strong{font-weight:700}

/* ---------- type scale ---------- */
.page-h h1,.h-teams,.cup-h,.t-head h1{font-family:var(--disp);font-weight:800;font-stretch:112%;letter-spacing:-.015em}
.card-h h3,.lb .card-h h3{font-family:var(--disp);font-weight:700;font-stretch:106%;font-size:16px;letter-spacing:-.005em}
.num,.oc-p,.strip b,.kpi .v b,.big-stat b,.tbl .pts,.gs,.mkt b,.sr b,.lb-row .v{font-stretch:110%}

/* ---------- chrome: phone ---------- */
.appbar{position:sticky;top:0;z-index:30;height:54px;display:flex;align-items:center;gap:8px;padding:0 16px;
  padding-top:env(safe-area-inset-top);box-sizing:content-box;background:var(--surface);border-bottom:1px solid var(--line)}
.brand,.brand-side{display:flex;align-items:center;gap:9px;font-weight:800;font-stretch:112%;font-size:16px;letter-spacing:-.01em}
.logo{width:26px;height:26px;color:var(--ink);flex:none}
.back{display:none;width:38px;height:38px;margin-left:-10px;border:0;background:none;border-radius:10px;cursor:pointer;align-items:center;justify-content:center}
.back svg,.back-inline svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.back:active{background:var(--soft)}
.appbar.detail .back{display:inline-flex}.appbar.detail .brand{display:none}
.bar-title{font-weight:700;font-stretch:106%;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.appbar:not(.detail) .bar-title{display:none}
.upd{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--w);flex:none}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav a[data-tab]{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--muted)}
.nav a[data-tab] svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--ink)}
.nav a.on svg{stroke-width:2.4}
.brand-side,.upd-side,.back-inline{display:none}

.view{max-width:760px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}

/* Phone: every section is a full-width white block; the grey between them does the dividing. */
.page-h{background:var(--surface);margin:0 -16px 8px;padding:20px 16px 16px}
.page-h h1{font-size:28px;line-height:1.1;margin:0}
.page-h p{margin:6px 0 0;color:var(--muted);font-size:13.5px;max-width:60ch}
.page-h .seg{margin:16px 0 0}.page-h .chips{margin:10px 0 0}
.card{background:var(--surface);margin:0 -16px 8px;padding:20px 16px}
.card-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.card-h h3{margin:0;flex:1}
.card-h .aside{font-size:12.5px;color:var(--muted)}

/* ---------- chrome: laptop ---------- */
@media (min-width:900px){
  :root{--bg:#ffffff}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1820}}
  .appbar{display:none}
  .nav{position:sticky;top:0;bottom:auto;height:64px;align-items:center;gap:4px;padding:0 max(32px,calc((100vw - 1200px)/2));
    border-top:0;border-bottom:1px solid var(--line);background:var(--surface)}
  .brand-side{display:flex;margin-right:28px;font-size:17px}
  .nav a[data-tab]{flex:none;flex-direction:row;gap:8px;padding:0 14px;height:64px;align-items:center;font-size:14.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .nav a[data-tab] svg{width:19px;height:19px}
  .nav a[data-tab]:hover{color:var(--ink)}
  .nav a.on{border-color:var(--ink)}
  .upd-side{display:flex;align-items:center;gap:7px;margin-left:auto;font-size:12.5px;color:var(--muted)}
  .view{max-width:1200px;padding:28px 32px 56px}
  .back-inline{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:6px 10px 6px 4px;margin:-6px 0 14px -4px;
    border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
  .back-inline:hover{background:var(--soft);color:var(--ink)}
  .back-inline svg{width:18px;height:18px}
  .page-h{background:none;margin:0 0 22px;padding:0}
  .page-h h1{font-size:34px}
  .card{margin:0 0 18px;padding:20px;border:1px solid var(--line);border-radius:var(--r-panel)}
}
@media (min-width:1180px){
  .cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px;align-items:start}
  .cols>.col{min-width:0}
  .grid-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;align-items:start}
}
@media (min-width:1500px){.grid-cards.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cols>.col,.grid-cards>*{min-width:0}

/* ---------- small parts ---------- */
.note{font-size:12.5px;color:var(--muted);margin:12px 0 0;max-width:68ch}
.muted{color:var(--muted)}
.more{display:flex;align-items:center;justify-content:center;margin-top:16px;padding:11px;border-radius:var(--r-tile);border:1px solid var(--line);
  font-weight:600;font-size:13.5px}
.more:hover{background:var(--soft)}
.more:active,.mkt:active,.btn:active{transform:scale(.99)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:var(--r-tile);border:1px solid var(--line);background:var(--surface);
  font-weight:600;font-size:13.5px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:14px}
.tl:hover{text-decoration:underline;text-underline-offset:3px}
details.info{margin-top:14px;font-size:13px;color:var(--muted)}
details.info summary{cursor:pointer;font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:7px}
details.info summary::-webkit-details-marker{display:none}
details.info summary::before{content:"?";display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;
  border:1.5px solid currentColor;font-size:10.5px;font-weight:800}
details.info dl{margin:8px 0 0}details.info dt{font-weight:700;color:var(--ink);margin-top:10px}details.info dd{margin:2px 0 0;max-width:62ch}
details.info p{margin:8px 0 0;max-width:62ch}

.seg{display:flex;gap:2px;padding:3px;background:var(--soft);border-radius:11px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.chips{display:flex;gap:6px;margin:-4px 0 16px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.date-h{font-weight:700;font-stretch:106%;font-size:14px;color:var(--ink);margin:20px 2px 10px}
.date-h:first-child{margin-top:4px}
.date-h.today::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--w);margin-left:8px;vertical-align:2px}

/* badges */
.bdg{flex:none;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:800;font-stretch:112%;letter-spacing:.02em;background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.bdg.me{background:var(--a);color:var(--a-on);box-shadow:inset 0 0 0 2px var(--a-on),0 0 0 1px var(--a)}
.bdg.lg{width:54px;height:54px;font-size:15px}
.bdg.sm{width:24px;height:24px;font-size:8px}
.bdg.dr{background:var(--draw-soft);color:var(--muted);font-size:13px;box-shadow:none}
.bdg.me.lg{background:repeating-linear-gradient(90deg,var(--stripe-a) 0 6px,var(--stripe-b) 6px 12px);color:var(--a);box-shadow:inset 0 0 0 2px var(--a),0 0 0 2px var(--surface)}
.bdg.me.lg span{background:var(--surface);padding:1px 5px;border-radius:5px}

/* verdict tags & deltas */
.vtag{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.vtag.good{background:var(--a);color:var(--a-on)}
.vtag.bad{background:var(--b-soft);color:var(--b)}
.vtag.even,.vtag.neu{background:var(--draw-soft);color:var(--ink)}
.vtag.ok{background:color-mix(in srgb,var(--w) 14%,transparent);color:var(--good)}
.vtag.miss{background:color-mix(in srgb,var(--l) 12%,transparent);color:var(--bad)}
.vtag.upset{background:var(--upset-soft);color:var(--upset)}
.delta{font-size:13px;font-weight:700;white-space:nowrap}.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.since{font-size:12.5px;color:var(--muted);margin-left:5px}
.ca{color:var(--a)}.cb{color:var(--b)}

/* ---------- the match header: the one loud thing ---------- */
.hero{position:relative;background:var(--surface);margin:0 -16px 8px;overflow:hidden}
.stripes{height:26px;background:repeating-linear-gradient(90deg,var(--stripe-a) 0 13px,var(--stripe-b) 13px 26px);border-bottom:1px solid var(--line)}
.hero-in{padding:18px 16px 20px}
@media (min-width:900px){
  .hero{margin:0 0 18px;border:1px solid var(--line);border-radius:var(--r-panel)}
  .hero-in{padding:22px 24px 24px}
  .stripes{height:30px;background:repeating-linear-gradient(90deg,var(--stripe-a) 0 15px,var(--stripe-b) 15px 30px)}
}
.m-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12.5px;color:var(--muted);font-weight:500}
.chip-s{background:var(--soft);border-radius:6px;padding:2px 8px;color:var(--ink);font-weight:600}
.m-meta .when{color:var(--ink);font-weight:600}
.h-teams{font-size:27px;line-height:1.08;margin:14px 0 0}
.h-teams>a{display:inline}.h-teams .row2{display:block}
.h-teams a:hover{text-decoration:underline;text-underline-offset:4px}
.h-teams .v{font-size:.62em;font-weight:600;font-stretch:100%;color:var(--muted);letter-spacing:0;margin-right:.3em;vertical-align:.12em}
.h-teams .me{color:var(--a)}
@media (min-width:900px){.h-teams{font-size:34px}}
.m-pos{font-size:13px;color:var(--muted);margin-top:10px}
.h-num{display:flex;align-items:flex-end;gap:14px;margin-top:20px;flex-wrap:wrap}
.h-num .big{font-family:var(--disp);font-weight:900;font-stretch:125%;font-size:68px;line-height:.82;letter-spacing:-.03em}
@media (min-width:900px){.h-num .big{font-size:84px}}
.h-lab{display:flex;flex-direction:column;gap:2px;padding-bottom:2px}
.h-lab>span:first-child{font-weight:700;font-size:15px}
.vline{display:flex;align-items:flex-start;gap:10px;margin-top:16px;font-size:14px;flex-wrap:wrap}
.vline .muted{flex:1;min-width:200px;padding-top:2px}
.score-big{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0 6px}
.score-big .tm{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:700;font-size:14.5px}
.score-big .sc{font-weight:900;font-stretch:125%;font-size:46px;letter-spacing:-.02em;line-height:1}
.score-big .ht{display:block;text-align:center;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:4px}

/* outcome rows */
.ocs-h{display:grid;grid-template-columns:minmax(0,1fr) 56px 58px;gap:10px;font-size:12px;color:var(--muted);font-weight:600;margin-top:18px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.ocs-h span:nth-child(2){text-align:right}.ocs-h span:nth-child(3){text-align:center}
.oc{display:grid;grid-template-columns:minmax(0,1fr) 56px 58px;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.oc-l{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;min-width:0}
.oc-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc-bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin:8px 0 0 40px}.oc-bar div{height:100%;border-radius:2px}
.oc.a .oc-bar div{background:var(--a)}.oc.d .oc-bar div{background:var(--draw)}.oc.b .oc-bar div{background:var(--b)}
.oc-p{font-weight:800;font-size:18px;text-align:right}
.oc-odds{text-align:center;font-size:13px;font-weight:700;border-radius:var(--r-chip);padding:7px 0}
.oc.a .oc-odds{background:var(--a);color:var(--a-on)}.oc.d .oc-odds{background:var(--draw-soft)}.oc.b .oc-odds{background:var(--b-soft);color:var(--b)}
.oc.won .oc-l>span:not(.bdg){font-weight:800}
.oc .res-mark{font-size:11px;font-weight:800;color:var(--good);margin-left:2px}

.strip{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip>div{padding:12px 6px;text-align:center}.strip>div+div{border-left:1px solid var(--line)}
.strip b{display:block;font-size:18px;font-weight:800}.strip span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.strip{grid-template-columns:repeat(2,1fr)}.strip>div:nth-child(3){border-left:0}.strip>div:nth-child(n+3){border-top:1px solid var(--line)}}

/* ---------- charts ---------- */
.chart{margin-top:18px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:8px}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.sw.a{background:var(--a)}.sw.b{background:var(--b)}.sw.n{background:var(--ink)}
.sw.d{background:repeating-linear-gradient(90deg,var(--draw) 0 4px,transparent 4px 7px)}
.ch{width:100%}
svg.lc,svg.bc{display:block;overflow:visible;touch-action:pan-y}
.lc .gl{stroke:var(--line);stroke-width:1}.lc .zero{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.lc .ax,.bc .ax{fill:var(--muted);font-size:10.5px;font-family:var(--disp)}
.lc .ln{fill:none;stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.lc .ln.a{stroke:var(--a)}.lc .ln.b{stroke:var(--b)}.lc .ln.n{stroke:var(--ink)}.lc .ln.d{stroke:var(--draw);stroke-dasharray:4 3;stroke-width:1.75}
.lc .area{stroke:none}
.lc .pt{stroke:var(--surface);stroke-width:2.5}.lc .pt.a{fill:var(--a)}.lc .pt.b{fill:var(--b)}.lc .pt.n{fill:var(--ink)}.lc .pt.d{fill:var(--draw)}
.lc .end{font-size:11.5px;font-weight:800;font-family:var(--disp)}.lc .end.a{fill:var(--a)}.lc .end.b{fill:var(--b)}.lc .end.n{fill:var(--ink)}.lc .end.d{fill:var(--muted)}
.lc .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2}
.lc.anim .ln:not(.d){stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.3,.7,.3,1) .15s forwards}
.lc.anim .ln.d,.lc.anim .area,.lc.anim .pt,.lc.anim .end{opacity:0;animation:fade .4s ease-out .9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.lc.anim .ln,.lc.anim .area,.lc.anim .pt,.lc.anim .end{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
.bc rect.fb{fill:var(--ink);opacity:.18}.bc rect.fb.a{fill:var(--a);opacity:.25}.bc rect.fb.top{opacity:1}
.bc rect.hit{fill:transparent}
.bc .val{fill:var(--ink);font-size:11px;font-weight:800;font-family:var(--disp)}
.spark{width:84px;height:26px;flex:none}
.spark path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spark .a{stroke:var(--a)}.spark .b{stroke:var(--b)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px 10px;font-size:12.5px;line-height:1.55;white-space:nowrap;color:var(--ink)}
.tip b{display:block;margin-bottom:2px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px}
.tip i.a{background:var(--a)}.tip i.b{background:var(--b)}.tip i.d{background:var(--draw)}.tip i.n{background:var(--ink)}

/* ---------- fixture tiles (one row per outcome, like a market) ---------- */
.mkts{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:700px){.mkts.wide{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.mkts.wide{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mkt{display:block;border:1px solid var(--line);border-radius:var(--r-tile);padding:12px 12px 10px;background:var(--surface);transition:border-color .12s}
.mkt:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.mkt.mine{border-color:var(--a);box-shadow:inset 3px 0 0 var(--a)}
.mkt-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.mkt-date{font-size:12.5px;color:var(--muted);font-weight:500}
.mkt-date.today{color:var(--ink);font-weight:700}
.mo{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px;min-width:0}
.mo-bar{display:none}
.mo-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-weight:500}
.mo b{font-weight:800;font-size:14.5px;color:var(--muted)}
.mo.lead .mo-n{color:var(--ink);font-weight:700}.mo.lead b{color:var(--ink)}
.mo.lead.a b{color:var(--a)}.mo.lead.b b{color:var(--b)}
.mkt-f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);min-height:26px}
.flag{font-size:12px;font-weight:700;color:var(--b)}
/* result tiles */
.sr{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14.5px;color:var(--muted)}
.sr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sr b{font-size:17px;font-weight:800;min-width:20px;text-align:right}
.sr.w{color:var(--ink)}.sr.w .nm{font-weight:700}
.sr.me .nm{color:var(--a);font-weight:700}

/* last game */
.resolved{display:block}
.rs-top{display:flex;align-items:center;gap:10px}.rs-date{font-size:12.5px;color:var(--muted)}
.rs-main{margin-top:10px;font-size:17px}.rs-main b{font-stretch:110%;font-weight:800}
.rs-sub{font-size:13px;color:var(--muted);margin-top:3px}

/* insights */
ul.ins{margin:0;padding:0;list-style:none;counter-reset:none}
ul.ins li{position:relative;padding:11px 0 11px 20px;border-top:1px solid var(--line);font-size:14.5px;max-width:70ch}
ul.ins li:first-child{border-top:0;padding-top:0}ul.ins li:first-child::before{top:8px}
ul.ins li:last-child{padding-bottom:0}
ul.ins li::before{content:"";position:absolute;left:3px;top:19px;width:7px;height:7px;border-radius:2px;background:var(--ink);transform:rotate(45deg)}

/* comparison bars */
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:13.5px;margin-bottom:6px}
.who a{display:flex;align-items:center;gap:7px;min-width:0}.who a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .wa{color:var(--a)}.who .wb{color:var(--b);flex-direction:row-reverse;text-align:right}
.cmp{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.cmp-v{text-align:center;font-weight:600;color:var(--muted);font-size:14.5px;line-height:1.15;font-stretch:108%}
.cmp-v small{display:block;font-size:11px;font-weight:500;color:var(--muted);font-stretch:100%}
.cmp-v.win{color:var(--ink);font-weight:800}
.cmp-l{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.bar{height:6px;background:var(--soft);border-radius:3px;display:flex;overflow:hidden}.bar.l{justify-content:flex-end}
.bar.l span{background:var(--a);border-radius:3px}.bar.r span{background:var(--b);border-radius:3px}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
@media (min-width:900px){.tbl-wrap{margin:0 -20px;padding:0 20px}}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;text-align:center;padding:8px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{text-align:center;padding:10px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .l{text-align:left}.tbl .r{text-align:right}
.tbl tr[data-href]{cursor:pointer}.tbl tr[data-href]:hover td{background:var(--soft)}
.tbl tr.me td{background:var(--a-soft);font-weight:700}
.tbl tr.me td:first-child{box-shadow:inset 3px 0 0 var(--a)}
.tbl tr.hl td{background:var(--b-soft)}
.tbl .tm{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.tbl .tm span{overflow:hidden;text-overflow:ellipsis;max-width:200px}
.tbl .pts{font-weight:800}
.tbl .sub{display:block;font-size:11px;color:var(--muted);font-weight:500}
.posn{width:24px;color:var(--muted);font-weight:700}
.mv{width:30px;font-size:11.5px;font-weight:700;color:var(--muted)}
.mv.up{color:var(--good)}.mv.down{color:var(--bad)}
.minibar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden;width:70px;display:inline-block;vertical-align:middle;margin-left:6px}
.minibar span{display:block;height:100%;background:var(--ink);border-radius:3px}
@media (max-width:560px){.tbl .hs{display:none}.tbl .tm span{max-width:128px}.tbl td,.tbl th{padding-left:3px;padding-right:3px}}
@media (max-width:380px){.tbl .hxs{display:none}}

/* form */
.chip{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:5px;color:#fff;font-weight:800;font-size:10.5px;margin-right:2px}
.chip.sm{width:auto;padding:0 6px;height:20px;font-size:11px}
.chip.W{background:var(--w)}.chip.D{background:var(--d)}.chip.L{background:var(--l)}.chip.N{background:var(--draw-soft);color:var(--muted)}
.form-dots{display:inline-flex;gap:3px;vertical-align:middle}
.form-dots i{width:8px;height:8px;border-radius:50%}.form-dots .W{background:var(--w)}.form-dots .D{background:var(--d)}.form-dots .L{background:var(--l)}

/* games list */
.games{list-style:none;margin:0;padding:0}
.games li{border-top:1px solid var(--line)}
.games li:first-child{border-top:0}
.games>li>a,.games .row{display:grid;grid-template-columns:24px 78px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:10px 2px;font-size:14.5px}
.games>li>a:hover{background:var(--soft)}
.games .dt{color:var(--muted);font-size:12.5px;white-space:nowrap}
.games .op{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.games .op i{font-style:normal;color:var(--muted);font-size:12.5px}
.games .gv{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.games .gs{font-weight:800;min-width:36px;text-align:right}

/* team page */
.t-head{display:flex;align-items:center;gap:14px}
.t-head h1{margin:0;font-size:24px;line-height:1.1}
.t-sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.t-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.t-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
@media (max-width:440px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:12px 12px 12px 0;border-bottom:1px solid var(--line)}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{display:flex;align-items:baseline;gap:8px;margin-top:3px;flex-wrap:wrap}
.kpi .v b{font-size:21px;font-weight:800;letter-spacing:-.01em}
.rk{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.rk.top{color:var(--good)}.rk.bot{color:var(--bad)}
.splits{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split{border:1px solid var(--line);border-radius:var(--r-tile);padding:11px 12px}
.split h4{margin:0 0 7px;font-size:14px;font-stretch:106%}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:2px 0}.kv span{color:var(--muted)}.kv b{font-weight:700}
.big-stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
@media (max-width:420px){.big-stat{grid-template-columns:repeat(2,minmax(0,1fr))}}
.big-stat div b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.big-stat div span{font-size:12.5px;color:var(--muted)}

/* leaderboards */
.lb-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.lb-row:first-of-type{border-top:0}
a.lb-row:hover{background:var(--soft)}
.lb-row .n{color:var(--muted);font-weight:700;font-size:13px;text-align:center}
.lb-row .t{display:flex;align-items:center;gap:10px;min-width:0;font-weight:600;font-size:14.5px}
.lb-row .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .t small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.lb-row .v{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.lb-row.me .t>span:not(.bdg){color:var(--a);font-weight:800}
.lb-row.extra{display:none}.lb.open .lb-row.extra{display:grid}
.lb-more{margin-top:10px;width:100%;border:1px solid var(--line);background:none;border-radius:var(--r-tile);padding:9px;font-weight:600;font-size:13px;cursor:pointer}
.lb-more:hover{background:var(--soft)}
.lb .hide-open{display:inline}.lb.open .hide-open{display:none}.lb .show-open{display:none}.lb.open .show-open{display:inline}
.cmp-link{display:flex;align-items:center;gap:14px}
.cmp-link b{font-stretch:106%;font-size:16px}

/* compare */
.pickers{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pickers select{width:100%;padding:11px 12px;border-radius:var(--r-tile);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:14.5px}
.pickers .pa{border-color:var(--a)}.pickers .pb{border-color:var(--b)}
.pickers .vs{color:var(--muted);font-weight:600;font-size:13px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.duo{grid-template-columns:1fr}}
.mini3{display:flex;height:32px;border-radius:8px;overflow:hidden;gap:2px;font-size:12.5px;font-weight:800;color:#fff}
.mini3 div{display:flex;align-items:center;justify-content:center;min-width:36px}
.mini3 .a{background:var(--a);color:var(--a-on)}.mini3 .d{background:var(--draw)}.mini3 .b{background:var(--b)}
.mini3-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}

/* players */
.bk{display:inline-block;width:9px;height:12px;border-radius:2px;margin:0 2px 0 4px;vertical-align:-1px}.bk.y{background:#f5c518}.bk.r{background:#d61f2c}

footer.foot{color:var(--muted);font-size:12.5px;padding:12px 2px 0;max-width:72ch}
@media (min-width:900px){footer.foot{padding-top:8px}}

/* ---------- cup ---------- */
.cup-grid{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"status" "bracket" "other"}
.cup-grid>*{min-width:0}.ca-status{grid-area:status}.ca-bracket{grid-area:bracket}.ca-other{grid-area:other}
@media (min-width:1180px){.cup-grid{grid-template-columns:minmax(0,.85fr) minmax(0,1.6fr);grid-template-areas:"status bracket" "other bracket";grid-template-rows:auto 1fr;gap:0 24px;align-items:start}}
.cup-h{font-size:24px;line-height:1.1;margin:12px 0 0}
.cup-status .vtag{margin-top:14px}
.next-tie{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-tile);padding:12px 14px}
.nt-when{font-size:13px;color:var(--muted)}.nt-t{font-size:18px;font-weight:800;font-stretch:108%;margin-top:3px}
.cup-run .row{grid-template-columns:24px 86px minmax(0,1fr) auto auto}
.br-scroll{overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
@media (min-width:900px){.br-scroll{margin:0 -20px;padding:2px 20px 8px}}
.br{position:relative}
.br-h{position:absolute;top:0;font-size:13px;font-weight:700;font-stretch:106%;color:var(--ink);white-space:nowrap}
.br-h span{display:block;font-size:11px;font-weight:500;font-stretch:100%;color:var(--muted)}
.br-h.fut{color:var(--muted)}
.br-lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.br-lines path{fill:none;stroke:var(--line);stroke-width:1.5}
.br-lines path.fut{stroke-dasharray:3 4}
.br-lines path.me{stroke:var(--a);stroke-width:2.5}
.bx{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-tile);padding:6px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.bx.mine{border-color:var(--a);box-shadow:inset 3px 0 0 var(--a)}
.bx.empty{align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;font-weight:600;background:var(--soft)}
.bx.empty.fut{background:transparent;border-style:dashed}
.bx-m{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx-r{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;min-width:0}
.bx-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bx-s,.bx-p{flex:none;font-weight:800;min-width:16px;text-align:right;font-stretch:110%}
.bx-p{font-size:12px;color:var(--muted)}
.bx-r.win{font-weight:700}
.bx-r.lose{color:var(--muted)}.bx-r.lose .bx-n a{color:var(--muted)}
.bx-r.me .bx-n,.bx-r.me .bx-n a{color:var(--a);font-weight:800}
.bx.upcoming .bx-m{color:var(--ink)}
details.fold-card{padding:16px}
@media (min-width:900px){details.fold-card{padding:16px 20px}}
details.fold-card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details.fold-card>summary::-webkit-details-marker{display:none}
details.fold-card>summary h3{margin:0;font-size:16px;font-weight:700;font-stretch:106%;flex:1}
details.fold-card>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 3px 0}
details.fold-card[open]>summary::after{transform:rotate(-135deg);margin-bottom:-3px}
.sum-tag{font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:20px;padding:3px 10px}
.mkt .nm.w{font-weight:800}
.mkt-t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0}
.mkt-t .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mkt-t i{font-style:normal;color:var(--muted);font-weight:500;font-size:12.5px;flex:none}
.mkt-t .sc{margin-left:auto;font-size:16px;font-weight:800;flex:none;padding-left:6px}
.cup-mini{display:flex;align-items:center;gap:14px}
.cm-ic{width:42px;height:42px;border-radius:12px;background:var(--a);color:var(--a-on);display:flex;align-items:center;justify-content:center;flex:none}
.cm-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

<main id="view" class="view"></main>
<div id="tip" class="tip" role="tooltip" hidden></div>

    <clipPath id="shield-clip"><path d="M50 16 L78 26 L78 50 C78 68 66 80 50 86 C34 80 22 68 22 50 L22 26 Z"/></clipPath>

      <rect width="100" height="100" rx="24" fill="currentColor"/>
      <g clip-path="url(#shield-clip)"><rect width="100" height="100" fill="var(--surface)"/>
        <rect x="29" width="8.5" height="100" fill="currentColor"/><rect x="46" width="8.5" height="100" fill="currentColor"/>
        <rect x="63" width="8.5" height="100" fill="currentColor"/></g>
