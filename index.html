<style>/* ============ tokens ============ */
:root{
  color-scheme:light dark;
  --bg:#f2f3f5; --surface:#fff; --fill:#eceef1; --line:#e0e3e7; --line-2:#c9cdd3;
  --ink:#000; --ink-2:#434851; --ink-3:#5d636d;
  --a:#000; --a-on:#fff;            /* Dereham */
  --b:#e8590c; --b-ink:#b04405;     /* the opponent: fill, and a darker one for text */
  --draw:#7f858f;
  --w:#0f7a3b; --l:#c42b2b; --dr:#5d636d;       /* results only */
  --w-bg:#e3f4ea; --l-bg:#fbe9e9; --dr-bg:#eceef1;
  --r1:6px; --r2:10px; --r3:16px; --r4:24px;
  --pop:0 16px 48px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.10);
  --t1:120ms; --t2:260ms; --ease:cubic-bezier(.2,.8,.2,1);
  --wide:125%;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111214; --surface:#1a1c20; --fill:#25282d; --line:#2e3238; --line-2:#444a53;
    --ink:#fff; --ink-2:#bcc1c9; --ink-3:#9aa0aa;
    --a:#fff; --a-on:#000;
    --b:#ff7a33; --b-ink:#ff8d52;
    --draw:#7f8590;
    --w:#4ad486; --l:#ff7b7b; --dr:#aeb4bd;
    --w-bg:#143222; --l-bg:#3a1c1c; --dr-bg:#2a2d33;
    --pop:0 16px 48px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4);
  }
}
/* The scoreboard: black in both themes, so Dereham is white inside it. */
.inv{
  --bg:#000; --surface:#000; --fill:#1d1f23; --line:#2b2e34; --line-2:#4a4f58;
  --ink:#fff; --ink-2:#c3c7ce; --ink-3:#a2a7b0;
  --a:#fff; --a-on:#000; --b:#ff7a33; --b-ink:#ff8d52; --draw:#7f8590;
  --w:#4ad486; --l:#ff7b7b; --dr:#aeb4bd; --w-bg:#143222; --l-bg:#3a1c1c; --dr-bg:#2a2d33;
  background:#000; color:#fff;
}

/* ============ base ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Archivo,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(60px + env(safe-area-inset-bottom));overflow-x:hidden}
h1,h2,h3,h4,p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
svg{display:block}
.skip{position:absolute;left:8px;top:-60px;z-index:99;background:var(--surface);color:var(--ink);padding:12px 16px;border-radius:var(--r2)}
.skip:focus{top:8px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.inv :focus-visible{outline-color:#fff}
#view:focus{outline:none}
.disp{font-stretch:var(--wide);font-weight:800;letter-spacing:-.015em;line-height:1.08}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.only-wide{display:none}
@media (min-width:900px){ body{padding-bottom:0} .only-wide{display:block} .only-narrow{display:none!important} }

/* ============ top bar and navigation ============ */
.topbar{position:sticky;top:0;z-index:30;view-transition-name:top}
.top-in{display:flex;align-items:center;gap:4px;height:52px;padding:0 4px 0 16px;max-width:1480px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-stretch:var(--wide);font-weight:800;font-size:16px;letter-spacing:-.01em;min-height:44px;white-space:nowrap}
.logo{width:26px;height:26px;border-radius:6px}
.top-title{display:none;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:0}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;border-radius:var(--r2);cursor:pointer;flex:none}
.icon-btn svg,.search-btn svg,.nav svg,.search-h svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active,.search-btn:active{background:var(--fill)}
.back{display:none;margin-left:-12px}
.search-btn{height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;gap:10px;background:none;border:0;border-radius:var(--r2);cursor:pointer}
.search-btn .s-ph,.search-btn kbd,.upd{display:none}
.topbar.detail .back{display:grid}
.topbar.detail .brand{display:none}
.topbar.detail .top-title{display:block}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:#000;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);view-transition-name:nav}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:60px;text-decoration:none;color:var(--ink-3);font-size:12px;font-weight:600;position:relative}
.nav a.on{color:#fff}
.nav a.on::before{content:"";position:absolute;top:0;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:#fff}
.nav a:active{background:var(--fill)}
.nav .wide-only{display:none}

@media (min-width:900px){
  .top-in{height:60px;padding:0 32px;gap:8px}
  .brand{font-size:18px;margin-right:16px}
  .topbar.detail .back{display:none}
  .topbar.detail .brand{display:flex}
  .topbar.detail .top-title{display:none}
  .nav{position:static;display:flex;gap:2px;background:none;border:0;padding:0;align-self:stretch}
  .nav a{flex-direction:row;gap:8px;height:auto;padding:0 12px;font-size:14px;color:var(--ink-2)}
  .nav a svg{width:18px;height:18px}
  .nav a:hover{color:#fff}
  .nav a.on::before{top:auto;bottom:0;left:12px;right:12px;width:auto;margin:0;border-radius:3px 3px 0 0}
  .nav .wide-only{display:flex}
  .top-actions{gap:8px}
  .search-btn{justify-content:flex-start;width:300px;white-space:nowrap;padding:0 10px 0 12px;background:var(--fill);border:1px solid var(--line);color:var(--ink-2);height:40px}
  .search-btn:hover{border-color:var(--line-2);color:#fff}
  .search-btn svg{width:18px;height:18px}
  .search-btn .s-ph{display:block;flex:1;text-align:left;font-size:14px}
  .search-btn kbd{display:block;font:600 12px/1 inherit;font-family:inherit;border:1px solid var(--line-2);border-radius:5px;padding:4px 6px;color:var(--ink-2)}
  .upd{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap;margin-left:4px}
}
@media (min-width:900px) and (max-width:1180px){ .search-btn{width:44px;justify-content:center;padding:0} .search-btn .s-ph,.search-btn kbd,.upd{display:none} .nav a{padding:0 9px} .nav a svg{display:none} }

/* ============ layout ============ */
.page{max-width:1480px;margin:0 auto;padding:16px 16px 8px}
.page-h{margin:4px 0 16px}
.page-h h1{font-size:28px}
.page-h p{color:var(--ink-2);font-size:14px;margin-top:4px;max-width:64ch}
.crumbs{display:none;font-size:14px;color:var(--ink-2);margin:0 0 12px;gap:8px;align-items:center}
.crumbs a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.crumbs a:hover{text-decoration:underline}
.crumbs span[aria-current]{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.grid>*{grid-column:span 12;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.rail{display:none}
@media (min-width:900px){
  .page{padding:24px 32px 8px}
  .page-h h1{font-size:40px}
  .crumbs{display:flex}
  .grid{gap:16px}
  .grid>.m6{grid-column:span 6}
  .grid>.m4{grid-column:span 4}
  .grid>.m8{grid-column:span 8}
  .stack{gap:16px}
}
@media (min-width:1200px){
  .with-rail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
  .rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:84px}
  .grid>.l4{grid-column:span 4}
  .grid>.l8{grid-column:span 8}
  .grid>.l6{grid-column:span 6}
  .grid>.l12{grid-column:span 12}
}

/* ============ cards ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:16px;min-width:0;container-type:inline-size}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;min-height:24px}
.card-h h2,.card-h h3{font-size:16px;font-weight:700;line-height:1.25}
.card-h .aside{font-size:14px;color:var(--ink-2);white-space:nowrap}
.card.flush{padding:0;overflow:hidden}
.card.flush>.card-h{padding:16px 16px 0;margin-bottom:8px}
.card.flush>.card-f{padding:0 16px 16px}
.card-f{margin-top:12px}
.note{font-size:14px;color:var(--ink-2);margin-top:12px;max-width:70ch}
@media (min-width:900px){ .card{padding:20px} .card.flush>.card-h{padding:20px 20px 0} .card.flush>.card-f{padding:0 20px 20px} }

/* fold on phone, always open on laptop (script opens them) */
details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:44px;margin:-10px 0}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2{font-size:16px;font-weight:700;flex:none}
details.card>summary .sum{flex:1;min-width:0;text-align:right;font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.card>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);margin:0 4px 4px 0;flex:none;transition:transform var(--t1)}
details.card[open]>summary::after{transform:rotate(-135deg);margin:4px 4px 0 0}
details.card[open]>summary{margin-bottom:6px}
details.card[open]>summary .sum{visibility:hidden}
@media (min-width:900px){ details.card>summary{pointer-events:none;margin:-10px 0 2px} details.card>summary::after{display:none} }

/* ============ small pieces ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r2);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-weight:600;font-size:14px;line-height:1.1;text-decoration:none;cursor:pointer;transition:transform var(--t1) var(--ease),background var(--t1);text-align:center}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--a);color:var(--a-on);border-color:var(--a);font-size:16px;font-weight:700}
.btn.sm{min-height:44px;padding:0 12px}
.btn.block{display:flex;width:100%}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;font-size:14px;font-weight:600;text-decoration:none;border-top:1px solid var(--line);padding:0 16px}
.linkrow::after,.rowlink::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-top:2px solid var(--ink-3);transform:rotate(45deg);flex:none;margin-right:4px}
.linkrow:hover{background:var(--fill)}
@media (min-width:900px){ .linkrow{padding:0 20px} }

.mono{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:var(--r1);background:var(--mc,#5d636d);color:#fff;font-stretch:75%;font-weight:800;font-size:11px;letter-spacing:.02em;line-height:1}
.mono.me{background:var(--a);color:var(--a-on)}
.mono.s{width:24px;height:24px;font-size:10px;border-radius:5px}
.mono.l{width:36px;height:36px;font-size:13px;border-radius:8px}
.mono.xl{width:56px;height:56px;font-size:20px;border-radius:12px}
.mono.eq{background:var(--fill);color:var(--ink-2);border:1px solid var(--line)}
.tl{text-decoration:none;font-weight:600}
.tl:hover{text-decoration:underline}

.chip{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font-size:12px;font-weight:800;line-height:1}
.chip.W{background:var(--w-bg);color:var(--w)} .chip.L{background:var(--l-bg);color:var(--l)} .chip.D{background:var(--dr-bg);color:var(--dr)}
.chip.N{background:none;border:1.5px dashed var(--line-2)}
.chip.sc{width:auto;padding:0 6px;font-weight:700}
.chips-f{display:inline-flex;gap:4px;vertical-align:middle}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%}
.dots .W{background:var(--w)} .dots .L{background:var(--l)} .dots .D{background:var(--draw)}

.tag{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--fill);color:var(--ink)}
.tag.ok{background:var(--w-bg);color:var(--w)} .tag.miss{background:var(--l-bg);color:var(--l)} .tag.upset{background:var(--ink);color:var(--surface)}
.tag svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mv{font-size:12px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.mv.up{color:var(--w)} .mv.down{color:var(--l)}
.delta{font-weight:700;white-space:nowrap}
.delta.up{color:var(--w)} .delta.down{color:var(--l)}
.rk{font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}

/* tap-to-explain: the one pattern for every bit of jargon */
.ex{display:inline;background:none;border:0;padding:12px 8px;margin:-12px -8px;cursor:help;text-decoration:underline dotted;text-decoration-color:var(--ink-3);text-underline-offset:3px;text-align:inherit;font-weight:inherit;color:inherit;border-radius:4px}
.ex:hover{text-decoration-style:solid}

.seg{display:flex;background:var(--fill);border-radius:var(--r2);padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg>*{flex:1 0 auto;min-height:44px;padding:0 14px;border:0;border-radius:8px;background:none;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.seg>.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.inline{display:inline-flex}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.pills::-webkit-scrollbar{display:none}
.pills>*{flex:none;min-height:44px;padding:0 14px;border:1px solid var(--line-2);border-radius:99px;background:var(--surface);font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.pills>.on{background:var(--a);color:var(--a-on);border-color:var(--a)}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
@media (min-width:900px){ .seg{display:inline-flex} .pills{margin:0;padding:2px 0;flex-wrap:wrap} }
@media (min-width:900px) and (pointer:fine){ .seg>*{min-height:36px} .pills>*{min-height:36px} }
@media (max-width:899px){ .controls>.seg{width:100%} .controls>.pills{width:calc(100% + 32px)} }

.empty{padding:20px 16px;text-align:center;color:var(--ink-2);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:12px}

/* ============ the split bar: home, draw, away ============ */
.split{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;background:none}
.split i{display:block;min-width:3px;background:var(--draw)}
.split.lg{height:14px;gap:3px}
.split.sm{height:6px}
.tri{min-width:0}
.tri-n{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:8px;margin-bottom:10px}
.tri-n>div{min-width:0}
.tri-n>div:nth-child(2){text-align:center}
.tri-n>div:nth-child(3){text-align:right}
.tri-n b{display:block;font-stretch:var(--wide);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em}
.tri-n .dn b{font-size:28px;color:var(--ink-2)}
.tri-l{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;margin-top:8px;font-size:14px;font-weight:600}
.tri-l>span{display:flex;align-items:center;gap:6px;min-width:0}
.tri-l>span:nth-child(2){justify-content:center;color:var(--ink-2)}
.tri-l>span:nth-child(3){justify-content:flex-end}
.tri-l .k{width:10px;height:10px;border-radius:3px;flex:none}
.tri-l .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tri-l .hap{font-size:12px;font-weight:700;color:var(--w);white-space:nowrap}
.tri.sm .tri-n b{font-size:28px}
.tri.sm .tri-n .dn b{font-size:20px}

/* ============ the scoreboard (home and match pages) ============ */
.stage{view-transition-name:stage}
.stage-in{max-width:1480px;margin:0 auto;padding:12px 16px 20px;display:grid;gap:24px}
.mh-top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink-2);min-height:28px}
.mh-top .count{font-weight:700;color:#000;background:#fff;border-radius:99px;padding:3px 10px;white-space:nowrap}
.mh-top .count.soon{background:var(--b);color:#000}
.mh-teams{display:grid;gap:6px;margin:10px 0 8px;font-size:20px;font-weight:700;line-height:1.2}
.mh-t{display:flex;align-items:center;gap:12px;text-decoration:none;min-height:44px;min-width:0}
.mh-t .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mh-t .pos{font-size:14px;font-weight:600;color:var(--ink-2);flex:none}
.mh-t .sc{font-stretch:var(--wide);font-weight:800;font-size:40px;line-height:1;flex:none;min-width:36px;text-align:right}
.mh-t.lost .nm,.mh-t.lost .sc{color:var(--ink-3)}
.mh-when{font-size:14px;color:var(--ink-2)}
.verdict{font-size:28px;margin:18px 0 6px;text-wrap:balance}
.mh-why{font-size:14px;color:var(--ink-2);margin-bottom:18px;min-height:20px}
.mh-why .delta{margin-right:4px}
.mh-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.mh-actions.one{grid-template-columns:1fr}
.mh-x{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:14px;color:var(--ink-2)}
.linkbtn{background:none;border:0;padding:12px 0;margin:-12px 0;font-size:14px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.st-side h2{font-size:16px;font-weight:700;margin-bottom:8px}
@media (min-width:900px){
  .stage-in{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:56px;padding:28px 32px 36px;align-items:center}
  .stage-in.solo{grid-template-columns:minmax(0,720px)}
  .mh-teams{font-size:28px;gap:4px}
  .verdict{font-size:40px;margin-top:22px}
  .mh-why{font-size:16px}
  .tri-n b{font-size:56px}
  .tri-n .dn b{font-size:36px}
  .tri.sm .tri-n b{font-size:28px}
  .tri.sm .tri-n .dn b{font-size:20px}
  .mh-actions{display:flex}
  .mh-actions .btn{min-width:180px}
}

/* ============ fixture and result rows ============ */
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 8px;font-size:14px;font-weight:700}
.day-h span{font-weight:500;color:var(--ink-2)}
.day-h.today{color:var(--b-ink)}
.fx{display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:6px;align-items:center;padding:10px 16px;text-decoration:none;border-top:1px solid var(--line);position:relative;transition:background var(--t1)}
.fx:hover{background:var(--fill)}
.fx:active{background:var(--line)}
.fx.mine::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--a)}
.fx-when{font-size:12px;color:var(--ink-2);line-height:1.3}
.fx-when b{display:block;font-weight:600;color:var(--ink);font-size:14px}
.fx-body{min-width:0;display:grid;gap:2px}
.fx-t{display:flex;align-items:center;gap:8px;min-width:0;height:28px}
.fx-t .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-t .v{font-size:14px;min-width:40px;text-align:right;color:var(--ink-2);font-weight:500}
.fx-t.top .nm{font-weight:700}
.fx-t.top .v{font-weight:800;color:var(--ink)}
.fx-t .v.sc{font-size:16px;font-weight:500;color:var(--ink)}
.fx-t.top .v.sc{font-weight:800}
.fx-t.dim .nm,.fx-t.dim .v.sc{color:var(--ink-2)}
.fx .split{margin-top:6px}
.fx-side{display:none}
.fx-mark{position:absolute;right:16px;top:50%;margin-top:-10px}
.fx.res{grid-template-columns:56px minmax(0,1fr) 28px}
.fx-ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;justify-self:end}
.fx-ic svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fx-ic.ok{background:var(--w-bg);color:var(--w)} .fx-ic.miss{background:var(--l-bg);color:var(--l)} .fx-ic.upset{background:var(--ink);color:var(--surface)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2);align-items:center}
.key span{display:inline-flex;align-items:center;gap:6px}
@container (min-width:600px){
  .fx,.fx.res{grid-template-columns:56px minmax(0,1fr) 220px}
  .fx-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--ink-2);text-align:right}
  .fx.res .fx-ic,.fx-flag{display:none}
}
@media (min-width:900px){ .fx{padding:12px 20px} .day-h{padding:16px 20px 8px} }

/* ============ plain rows (home) ============ */
.rowlink{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 16px;text-decoration:none;border-top:1px solid var(--line);transition:background var(--t1)}
.rowlink:first-child{border-top:0}
.rowlink:hover{background:var(--fill)}
.rowlink:active{background:var(--line)}
.rowlink .rl-ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--fill);flex:none;font-weight:800}
.rowlink .rl-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rowlink .rl-ic.W{background:var(--w-bg);color:var(--w)} .rowlink .rl-ic.L{background:var(--l-bg);color:var(--l)} .rowlink .rl-ic.D{background:var(--dr-bg);color:var(--dr)}
.rowlink .rl-t{flex:1;min-width:0}
.rowlink .rl-t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowlink .rl-t span{display:block;font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:900px){ .rowlink{padding:10px 20px} }

/* ============ numbers ============ */
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.nums.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.nums.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.num{background:var(--surface);padding:12px;min-width:0;text-align:left;border:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;width:100%;font:inherit;color:inherit}
button.num{cursor:help}
button.num:hover{background:var(--fill)}
.num .k{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.3;display:block}
button.num .k{text-decoration:underline dotted;text-decoration-color:var(--ink-3);text-underline-offset:3px}
.num .v{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:4px}
.num .v b{font-stretch:var(--wide);font-weight:800;font-size:20px;line-height:1.1;letter-spacing:-.01em}
.num .u{font-size:12px;color:var(--ink-2);display:block;margin-top:2px}
.num .where{display:block;position:relative;height:6px;border-radius:3px;background:var(--fill);margin-top:10px}
.num .where i{position:absolute;top:-3px;width:4px;height:12px;border-radius:2px;background:var(--ink);margin-left:-2px}
.num .where::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line-2)}
@media (max-width:420px){ .nums.four{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:900px){ .nums.wide3{grid-template-columns:repeat(3,minmax(0,1fr))} .num{padding:14px 16px} .num .v b{font-size:28px} .rail .num .v b,.nums.compact .num .v b{font-size:20px} }

.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span{color:var(--ink-2)}
.kv b{font-weight:700;text-align:right}
ul.ins{margin:0;padding:0;list-style:none}
ul.ins li{padding:10px 0 10px 18px;border-top:1px solid var(--line);position:relative;font-size:16px;line-height:1.4}
ul.ins li:first-child{border-top:0}
ul.ins li::before{content:"";position:absolute;left:2px;top:18px;width:6px;height:6px;border-radius:2px;background:var(--b)}

/* ============ tables ============ */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;font-weight:600;color:var(--ink-2);text-align:right;padding:10px 6px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:0 6px;height:48px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .l{text-align:left}
.tbl th:first-child,.tbl td:first-child{padding-left:16px}
.tbl th:last-child,.tbl td:last-child{padding-right:16px}
.tbl .posn{width:36px;text-align:left;font-weight:700;color:var(--ink-2)}
.tbl td.mvc{width:30px;text-align:left;padding:0}
.tbl .tm{display:flex;align-items:center;gap:10px;min-width:0}
.tbl .tm a{text-decoration:none;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.tbl .pts{font-weight:800;font-size:16px}
.tbl tbody tr[data-href]{cursor:pointer;transition:background var(--t1)}
.tbl tbody tr[data-href]:hover{background:var(--fill)}
.tbl tr.me td{background:var(--fill);font-weight:700}
.tbl tr.me td:first-child{box-shadow:inset 3px 0 0 var(--a)}
.tbl .hs{display:none}
.tbl.full .hs{display:table-cell}
.tbl.full .tm{min-width:150px}
.tbl td.l{max-width:0;width:99%}
.tbl.full td.l{max-width:none;width:auto}
.tbl td.l .tm a{white-space:nowrap}
.minibar{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--fill);vertical-align:middle;margin-left:8px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.bk{display:inline-block;width:9px;height:12px;border-radius:2px;margin:0 3px 0 8px;vertical-align:-1px}
.bk.y{background:#f2c200} .bk.r{background:#d93030}
@media (min-width:640px){ .tbl .hs{display:table-cell} .tbl td.l{max-width:none;width:auto} }
@media (min-width:900px){
  .tbl.big{font-size:16px}
  .tbl.big td{height:54px;padding:0 10px}
  .tbl.big th{padding:12px 10px;font-size:14px}
  .tbl.big .pts{font-size:20px}
  .tbl th:first-child,.tbl td:first-child{padding-left:20px}
  .tbl th:last-child,.tbl td:last-child{padding-right:20px}
}

/* ============ compare bars ============ */
.who{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-weight:700;font-size:14px}
.who a{display:flex;align-items:center;gap:8px;text-decoration:none;min-height:44px;min-width:0}
.who a span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who a:last-child{flex-direction:row-reverse;text-align:right}
.cmp{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cmp-v{font-weight:600;font-size:16px;color:var(--ink-2)}
.cmp-v:last-child{text-align:right}
.cmp-v.win{font-weight:800;color:var(--ink)}
.cmp-v small{display:block;font-size:12px;font-weight:600;color:var(--ink-2)}
.cmp-l{text-align:center;font-size:14px;font-weight:600;margin-bottom:6px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.bar{height:8px;background:var(--fill);border-radius:4px;display:flex;overflow:hidden}
.bar.lft{justify-content:flex-end}
.bar span{display:block;height:100%;border-radius:4px}

/* ============ lists ============ */
ul.games{margin:0;padding:0;list-style:none}
ul.games li{border-top:1px solid var(--line)}
ul.games li:first-child{border-top:0}
ul.games>li>a,ul.games>li>.row{display:grid;grid-template-columns:22px 58px minmax(0,1fr) auto 40px;gap:10px;align-items:center;min-height:48px;padding:6px 16px;text-decoration:none;font-size:14px}
ul.games>li>a:hover{background:var(--fill)}
ul.games .dt{color:var(--ink-2)}
ul.games .op{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:16px}
ul.games .op i{font-style:normal;font-weight:500;color:var(--ink-2);font-size:14px}
ul.games .gv{color:var(--ink-2);text-align:right;white-space:nowrap}
ul.games .gs{font-weight:800;text-align:right;font-size:16px;white-space:nowrap}
ul.games.cup-run>li>.row{grid-template-columns:22px 84px minmax(0,1fr) auto auto}
@media (max-width:420px){ ul.games .gv{display:none} ul.games>li>a,ul.games>li>.row{grid-template-columns:22px 58px minmax(0,1fr) 40px} ul.games.cup-run>li>.row{grid-template-columns:22px 78px minmax(0,1fr) auto} }
@media (min-width:900px){ ul.games>li>a,ul.games>li>.row{padding:6px 20px} }

.duo{display:grid;gap:16px}
.duo h3{font-size:14px;font-weight:700;margin-bottom:10px}
.duo h3 span{font-weight:500;color:var(--ink-2)}
.duo>div+div{border-top:1px solid var(--line);padding-top:16px}
@media (min-width:640px){ .duo{grid-template-columns:1fr 1fr;gap:24px} .duo>div+div{border-top:0;padding-top:0;border-left:1px solid var(--line);padding-left:24px} }

/* leaderboards */
.lb-list{display:none}
.lb-row{display:grid;grid-template-columns:24px 28px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:60px;padding:8px 16px 14px;border-top:1px solid var(--line);text-decoration:none;position:relative}
.lb-row:hover{background:var(--fill)}
.lb-row .n{font-size:14px;font-weight:700;color:var(--ink-2)}
.lb-row .t{min-width:0}
.lb-row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .t small{display:block;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .v{font-stretch:var(--wide);font-weight:800;font-size:16px;text-align:right;display:flex;align-items:center;gap:8px;white-space:nowrap}
.lb-row .lbar{position:absolute;left:78px;right:16px;bottom:7px;height:3px;border-radius:2px;background:var(--fill);overflow:hidden}
.lb-row .lbar i{display:block;height:100%;background:var(--ink-3);border-radius:2px}
.lb-row.me{background:var(--fill)}
.lb-row.me .t b{font-weight:800}
.lb-row.me .lbar i{background:var(--a)}
.lb-row.me::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--a)}
@media (min-width:900px){
  .lb-wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
  .lb-wrap>.pills{display:none}
  .lb-list{display:block;padding:8px}
  .lb-list a{display:flex;flex-direction:column;justify-content:center;min-height:52px;padding:6px 12px;border-radius:var(--r2);text-decoration:none}
  .lb-list a b{font-weight:600;font-size:14px}
  .lb-list a span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb-list a:hover{background:var(--fill)}
  .lb-list a.on{background:var(--a);color:var(--a-on)}
  .lb-list a.on span{color:var(--a-on);opacity:.75}
  .lb-row{padding:8px 20px 14px;grid-template-columns:28px 28px minmax(0,1fr) auto}
  .lb-row .lbar{left:86px;right:20px}
}

/* team header */
.t-head{display:flex;gap:16px;align-items:center}
.t-head h1{font-size:28px}
.t-sub{font-size:14px;color:var(--ink-2);margin-top:4px}
.t-meta{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;font-size:14px}
.t-actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.t-actions .btn{flex:1 1 auto}
@media (min-width:900px){ .t-head h1{font-size:40px} .t-actions .btn{flex:none} }

/* compare pickers */
.pickers{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:8px;align-items:center}
.pick{position:relative;display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:var(--r2);background:var(--surface);min-height:52px;padding:0 12px}
.pick select{appearance:none;-webkit-appearance:none;position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.pick .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick::after{content:"";width:7px;height:7px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);margin:0 2px 4px 0;flex:none}
.pick:focus-within{outline:2px solid var(--ink);outline-offset:2px}

/* ============ charts ============ */
.chart{min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:3px;border-radius:2px;display:inline-block}
.sw.a{background:var(--a)} .sw.b{background:var(--b)} .sw.d{background:var(--draw)} .sw.n{background:var(--a)}
.ch{width:100%;touch-action:pan-y;-webkit-user-select:none;user-select:none;border-radius:8px}
.ch svg{overflow:visible;cursor:crosshair}
.ch-f{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px}
.ch-f .hint{font-size:12px;color:var(--ink-2)}
svg .gl{stroke:var(--line);stroke-width:1}
svg .zero{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 4}
svg .ax{fill:var(--ink-2);font-size:12px;font-family:inherit}
svg .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
svg .ln.a,svg .ln.n{stroke:var(--a)} svg .ln.b{stroke:var(--b)} svg .ln.d{stroke:var(--draw);stroke-width:2}
svg .pt{stroke:var(--surface);stroke-width:2}
svg .pt.a,svg .pt.n{fill:var(--a)} svg .pt.b{fill:var(--b)} svg .pt.d{fill:var(--draw)}
svg .end{font-size:12px;font-weight:800;fill:var(--ink);font-family:inherit}
svg .xh{stroke:var(--ink-2);stroke-width:1}
svg .fb{fill:var(--draw)} svg .fb.a{fill:var(--ink-3)} svg .fb.top{fill:var(--a)}
svg .val{font-size:12px;font-weight:800;fill:var(--ink);font-family:inherit}
svg .hit{fill:transparent;cursor:pointer}
svg .hit:hover{fill:var(--ink);fill-opacity:.06}
.tip{position:fixed;z-index:60;background:var(--ink);color:var(--surface);border-radius:var(--r2);padding:8px 12px;font-size:14px;line-height:1.5;pointer-events:none;box-shadow:var(--pop);max-width:260px}
.tip b{display:block;font-weight:800}
.tip i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tip i.a,.tip i.n{background:var(--surface)} .tip i.b{background:var(--b)} .tip i.d{background:var(--draw)}

/* ============ cup bracket ============ */
.br-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 8px}
.br{position:relative}
.br-h{position:absolute;top:0;font-size:14px;font-weight:700}
.br-h span{display:block;font-size:12px;font-weight:500;color:var(--ink-2)}
.br-lines{position:absolute;inset:0;pointer-events:none}
.br-lines path{fill:none;stroke:var(--line-2);stroke-width:1.5}
.br-lines path.fut{stroke-dasharray:3 4}
.br-lines path.me{stroke:var(--a);stroke-width:2.5}
.bx{position:absolute;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);padding:6px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:14px}
.bx.mine{border:2px solid var(--a)}
.bx.empty{align-items:center;color:var(--ink-2);border-style:dashed;background:none;font-size:12px}
.bx-m{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx-r{display:flex;justify-content:space-between;gap:8px;min-width:0}
.bx-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bx-n a{text-decoration:none}
.bx-r.win{font-weight:800}
.bx-r.lose{color:var(--ink-2)}
.bx-r.me .bx-n{font-weight:800}
.bx-s,.bx-p{font-weight:700;flex:none}
.bx-p{color:var(--ink-2);font-weight:600}
.cup-h{font-size:20px;margin:10px 0 6px}
.tie{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.tie .nm.w{font-weight:800}
.tie .sc{font-weight:800;text-align:right}
.tie .meta{grid-column:1/-1;font-size:12px;color:var(--ink-2)}
@media (min-width:900px){ .br-scroll{margin:0 -20px;padding:0 20px 8px} .tie{padding:10px 20px} }

/* ============ sheets: bottom on phone, side panel on laptop ============ */
dialog{border:0;padding:0;color:var(--ink);background:var(--surface);max-width:none;max-height:none}
dialog::backdrop{background:rgba(0,0,0,.5)}
.sheet{position:fixed;inset:auto 0 0 0;width:100%;margin:0;max-height:86dvh;border-radius:var(--r4) var(--r4) 0 0;box-shadow:var(--pop);flex-direction:column;overflow:hidden}
.sheet[open]{display:flex;animation:sheet-up var(--t2) var(--ease)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 8px 8px 20px;flex:none}
.sheet-h h2{font-size:20px;font-stretch:var(--wide);font-weight:800;letter-spacing:-.01em}
.sheet-b{padding:0 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain}
.sheet-b p{margin:0 0 12px;max-width:60ch}
.sheet-b .lead{font-size:16px}
.sheet-b h3{font-size:16px;font-weight:700;margin:20px 0 6px}
.sheet-b .eg{background:var(--fill);border-radius:var(--r2);padding:12px;font-size:14px;margin-bottom:12px}
.gloss{margin:8px -20px 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.gloss button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:0 20px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font-weight:600;cursor:pointer}
.gloss button:hover{background:var(--fill)}
.gloss button::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-top:2px solid var(--ink-3);transform:rotate(45deg);flex:none}
@keyframes sheet-up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheet-in{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop-in{from{transform:translateY(-8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@media (min-width:900px){
  .sheet{inset:0 0 0 auto;width:440px;height:100dvh;max-height:none;border-radius:0;border-left:1px solid var(--line)}
  .sheet[open]{animation-name:sheet-in}
  .sheet-h{padding:20px 12px 12px 28px}
  .sheet-b{padding:0 28px 28px}
  .gloss{margin:8px -28px 0} .gloss button{padding:0 28px}
}
.search{position:fixed;inset:0;width:100%;height:100dvh;margin:0;flex-direction:column}
.search[open]{display:flex}
.search-h{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line);flex:none}
.search-h input{flex:1;min-width:0;height:44px;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;outline:none}
.search-h input::placeholder{color:var(--ink-3)}
.search-list{overflow-y:auto;overscroll-behavior:contain;padding:8px;flex:1}
.s-group{font-size:12px;font-weight:700;color:var(--ink-2);padding:12px 12px 4px}
.s-item{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 12px;border-radius:var(--r2);text-decoration:none;cursor:pointer}
.s-item .s-ic{width:28px;height:28px;border-radius:var(--r1);background:var(--fill);display:grid;place-items:center;flex:none}
.s-item .s-ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s-item .s-t{flex:1;min-width:0}
.s-item .s-t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-item .s-t span{display:block;font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-item[aria-selected="true"]{background:var(--fill)}
.s-item:active{background:var(--line)}
@media (min-width:900px){
  .search{inset:11vh auto auto 50%;transform:translateX(-50%);width:640px;height:auto;max-height:70vh;border-radius:var(--r3);border:1px solid var(--line);box-shadow:var(--pop)}
  .search[open]{animation:pop-in2 var(--t2) var(--ease)}
  .search-h .btn{display:none}
  .search-h{padding:8px 16px}
}
@keyframes pop-in2{from{opacity:0;margin-top:-8px}to{opacity:1;margin-top:0}}

/* ============ footer ============ */
.foot{font-size:14px;color:var(--ink-2);margin:24px 0 16px;padding:16px 0 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center}
.foot p{max-width:80ch}

/* ============ motion ============ */
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}
::view-transition-group(top),::view-transition-group(nav),::view-transition-group(stage){animation-duration:.16s}
.grow i{transition:flex-grow .7s var(--ease)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
}
@media print{ .top,.nav,.foot{display:none} body{padding:0;background:#fff} }

/* ============ additions ============ */
.card.flush>.note{padding:0 16px 16px;margin-top:12px}
.card.flush>.note.top{margin:0;padding-bottom:12px}
.card.flush>.in{padding:0 16px 16px}
.card.flush>.in.top{padding:16px 16px 4px}
.card.flush>.in.line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;padding-bottom:8px}
.card.flush>summary{margin:0;padding:6px 16px}
.card.flush[open]>summary{margin:0}
.card.flush>.card-h+.tbl,.card.flush>.card-h+ul.games{margin-top:-4px}
.bleed{margin:0 -16px}
.sheet-bleed{margin:0 -20px}
.xs-only{display:flex}
@media (min-width:640px){ .xs-only{display:none!important} }
@media (min-width:900px){
  .card.flush>.note{padding:0 20px 20px}
  .card.flush>.in{padding:0 20px 20px}
  .card.flush>.in.top{padding:20px 20px 4px}
  .card.flush>summary{padding:6px 20px}
  .bleed{margin:0 -20px}
  .sheet-bleed{margin:0 -28px}
  details.card:not(.fold)>summary{pointer-events:auto}
  details.card:not(.fold)>summary::after{display:block}
  .lb-main{margin-top:0}
}
.lb-main{margin-top:12px}
@media (min-width:900px){ .lb-main{margin-top:0} }

/* home dashboard */
.dash{display:grid;gap:12px}
.dcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.dcol:empty{display:none}
@media (min-width:900px){
  .dash{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .dcol{gap:16px}
  .dcol>.card:last-child{flex:1}
  .dcol:nth-child(3){grid-column:1/-1;flex-direction:row}
  .dcol:nth-child(3)>.card{flex:1}
}
@media (min-width:1200px){
  .dash{grid-template-columns:minmax(0,5fr) minmax(0,6fr) minmax(0,6fr)}
  .dcol:nth-child(3){grid-column:auto;flex-direction:column}
  .dcol:nth-child(3)>.card{flex:none}
  .dcol:nth-child(3)>.card:last-child{flex:1}
}
.nums.tight .num{padding:10px 8px}
.nums.four.tight{grid-template-columns:repeat(4,minmax(0,1fr))}
.nums.tight .num .v{gap:4px}

/* the rail on laptops */
.railm{display:block;text-decoration:none;border-color:#000;padding:16px 20px 20px}
.railm:hover{outline:2px solid var(--ink-3);outline-offset:1px}
.rm-t{display:flex;align-items:center;gap:10px;font-weight:700;margin-top:8px}
.rm-t span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm-when{font-size:14px;color:var(--ink-2);margin-top:10px}
.rm-v{font-size:20px;margin:14px 0 14px}

/* where a team sits among all of them */
.num .where{background:none;height:14px;margin-top:8px;border-bottom:1px solid var(--line-2)}
.num .where::before{display:none}
.num .where i{top:2px;width:2px;height:8px;margin-left:-1px;border-radius:1px;background:var(--ink-3);opacity:.45}
.num .where i.me{top:-2px;height:14px;width:4px;margin-left:-2px;background:var(--a);opacity:1;border-radius:2px}
.swap{border:1px solid var(--line-2);background:var(--surface)}
.pickers{margin-bottom:16px}

.verdict .ex{text-decoration:none;cursor:pointer}
.nums.tight .num .v b{font-size:20px}
.fx-flag{font-size:12px;color:var(--ink-2);margin-top:6px}
.fx-flag b{color:var(--ink)}

.ch-f .linkbtn{white-space:nowrap;flex:none}
.cmp.txt{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.cmp.txt .cmp-l{margin:0;font-weight:500;color:var(--ink-2)}
.formrow{display:flex;justify-content:space-between;gap:12px;padding:2px 0 12px}

abbr{text-decoration:none}
.fx-side .tag{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;line-height:24px}
.fx-side .tag svg{display:inline-block;vertical-align:-1px;margin-right:5px}
.rail .nums.four{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:900px){ .grid>.stack>.card:last-child{flex:1} }
/* wide rows: home on the left, away on the right, the bar between them */
@container (min-width:760px){
  .fx,.fx.res{grid-template-columns:56px minmax(0,1fr) 216px}
  .fx-body{grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);align-items:center;column-gap:14px}
  .fx-body .fx-t:nth-child(1){grid-column:1;grid-row:1}
  .fx-body .fx-t:nth-child(1) .nm{order:1;text-align:right}
  .fx-body .fx-t:nth-child(1) .mono{order:2}
  .fx-body .fx-t:nth-child(1) .v{order:3}
  .fx-body .split{grid-column:2;grid-row:1;margin:0;height:8px}
  .fx-body .fx-t:nth-child(2){grid-column:3;grid-row:1}
  .fx-body .fx-t:nth-child(2) .v{order:1;text-align:left}
  .fx-body .fx-t:nth-child(2) .mono{order:2}
  .fx-body .fx-t:nth-child(2) .nm{order:3}
  .fx.res .fx-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .fx.res .fx-body .fx-t:nth-child(2){grid-column:2}
  .fx.res .fx-t .v.sc{min-width:28px;font-size:20px}
  .fx{min-height:56px}

.ties{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

@media (max-width:420px){ .gv-note{display:none} }

.bx{padding:4px 10px;gap:0}
.bx-r{min-height:44px;align-items:center}
.bx-n a,.tie .nm a,ul.games .op a{display:inline-flex;align-items:center;min-height:44px;max-width:100%}

<script>(function () {
'use strict';

/* ================= data ================= */
const D = JSON.parse(document.getElementById('data').textContent);
const T = D.teams, ME = D.me, RES = D.results, FX = D.fixtures;
const BY = {};
RES.forEach(r => { BY[r.id] = r; });
FX.forEach(f => { BY[f.id] = f; });
const IDS = Object.keys(T).sort((a, b) => T[a].row.pos - T[b].row.pos);
const N = IDS.length;
const WIDE = () => window.matchMedia('(min-width:900px)').matches;
const MOTION = () => !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= helpers ================= */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = x => x == null ? '–' : Math.round(x * 100) + '%';
const sgn = (x, d = 1) => x == null ? '–' : (x > 0.0005 ? '+' : x < -0.0005 ? '−' : '') + Math.abs(x).toFixed(d);
const rel = x => x == null ? '–' : (x >= 1.005 ? '+' : x <= 0.995 ? '−' : '') + Math.round(Math.abs(x - 1) * 100) + '%';
const ord = n => n + ((n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const pad = n => String(n).padStart(2, '0');
const dt = iso => iso ? new Date(iso) : null;
// Days from today in the viewer's own time: 0 = today, 1 = tomorrow, -1 = yesterday.
function dayDiff(iso) {
  const d = dt(iso); if (!d) return null;
  const now = new Date();
  return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
}
const ftime = iso => { const d = dt(iso); return d && (d.getHours() || d.getMinutes()) ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : ''; };
function fdate(iso, time) {
  const d = dt(iso); if (!d) return 'Date to be confirmed';
  const dd = dayDiff(iso);
  let s = dd === 0 ? 'Today' : dd === 1 ? 'Tomorrow' : dd === -1 ? 'Yesterday' : `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
  if (time && ftime(iso)) s += `, ${ftime(iso)}`;
  return s;
}
const fshort = iso => { const d = dt(iso); return d ? `${d.getDate()} ${MON[d.getMonth()]}` : ''; };
const dayKey = iso => iso ? iso.slice(0, 10) : 'tbc';
function countdown(iso) {
  const d = dt(iso), dd = dayDiff(iso); if (!d || dd < 0) return null;
  if (dd === 0) {
    const ms = d - new Date();
    if (!ftime(iso)) return { t: 'Today', soon: true };
    if (ms <= 0) return { t: 'Kicked off', soon: true };
    const h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4);
    return { t: h ? `Kicks off in ${h}h ${m}m` : `Kicks off in ${m} min`, soon: true };
  }
  if (dd === 1) return { t: 'Tomorrow', soon: true };
  return { t: `In ${dd} days` };
}
const name = id => T[id] ? T[id].name : id;
const by = (f, dir = 1) => (x, y) => (f(x) > f(y) ? dir : f(x) < f(y) ? -dir : 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((x, y) => x + y, 0);

// Short names for tight spots ("Dereham", "Holt"), kept unique across the division.
const SN = (() => {
  const s1 = n => n.replace(/\s+(Res|Reserves|Dev|Development|A|B|U\d+)$/i, '');
  const s2 = n => s1(n).replace(/\s+(Town|United|Rovers|City|Athletic)$/i, '');
  const count = (f, v) => IDS.filter(i => f(T[i].name) === v).length;
  const out = {};
  IDS.forEach(id => { const n = T[id].name, b = s2(n), a = s1(n);
    out[id] = (b.length >= 3 && count(s2, b) === 1) ? b : count(s1, a) === 1 ? a : n; });
  return out;
})();
const sname = id => SN[id] || name(id);

// Unique three-letter codes (Dereham keeps DER; clashes get an alternative).
const AB = (() => {
  const out = {}, used = new Set();
  const cands = nm => {
    const w = nm.replace(/[^A-Za-z ]/g, '').split(/\s+/).filter(Boolean).map(x => x.toUpperCase());
    const a = w[0] || nm.toUpperCase();
    const cons = a.slice(1).replace(/[AEIOU]/g, '');
    const c = [a.slice(0, 3), a[0] + cons.slice(0, 2), a.slice(0, 2) + (w[1] || '')[0], a[0] + (w[1] || '')[0] + (w[2] || '')[0]];
    return c.filter(x => x && x.length === 3 && !/undefined/.test(x));
  };
  [ME, ...IDS.filter(i => i !== ME)].forEach((id, i) => {
    const c = cands(T[id].name).find(x => !used.has(x)) || (T[id].name.slice(0, 2).toUpperCase() + i);
    used.add(c); out[id] = c;
  });
  return out;
})();

// A colour for every club, generated from its place in the alphabet: hues spread by the golden
// angle so neighbours differ, all at one brightness so white letters always pass AA on top.
const COL = (() => {
  const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const rgb = (h, s, l) => { const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return [f(0), f(8), f(4)].map(x => Math.round(x * 255)); };
  const lum = c => 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]);
  const out = {};
  const ids = Object.keys(T).filter(i => i !== ME).sort(), n = ids.length || 1;
  const gcd = (a, b) => b ? gcd(b, a % b) : a;
  let step = Math.max(1, Math.round(n * 0.382)); while (gcd(step, n) !== 1) step++;
  ids.forEach((id, i) => {
    const h = 45 + ((i * step) % n) * (295 / n);  // skips the reds and oranges, which mean other things here
    let lo = 0.1, hi = 0.7, c;
    for (let k = 0; k < 18; k++) { const m = (lo + hi) / 2; c = rgb(h, 0.62, m); if (lum(c) > 0.15) hi = m; else lo = m; }
    out[id] = '#' + c.map(x => x.toString(16).padStart(2, '0')).join('');
  });
  return out;
})();
// Colour for a team inside a pairing: Dereham black/white, their opponent orange, anyone else their own.
const tone = (id, opp) => id === ME ? 'var(--a)' : opp === ME ? 'var(--b)' : (COL[id] || 'var(--draw)');

const IC = {
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

  bang: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v9M12 19h.01"/></svg>',
  cup: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4h9v5.5a4.5 4.5 0 0 1-9 0z"/><path d="M7.5 6.5H5a2.5 2.5 0 0 0 2.6 3.4M16.5 6.5H19a2.5 2.5 0 0 1-2.6 3.4M12 14v3.5M8.5 20.5h7M9.5 17.5h5"/></svg>',
  swap: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-3-3M18 16H6l3 3"/></svg>',
  page: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
  ball: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8l3.5 2.5-1.3 4h-4.4l-1.3-4z"/></svg>',
  person: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.5 3.6-5.5 7-5.5s6.2 2 7 5.5"/></svg>',
  help: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.2a2.8 2.8 0 1 1 4.2 2.5c-.9.5-1.5 1.1-1.5 2.1M12 17.3h.01"/></svg>',
  table: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16M4 14.5h16M10 5v14"/></svg>',
};

const mono = (id, sz = '') => `<span class="mono ${sz} ${id === ME ? 'me' : ''}"${id === ME ? '' : ` style="--mc:${COL[id]}"`} aria-hidden="true">${AB[id]}</span>`;
const monoX = (nm, sz = '') => `<span class="mono ${sz}" aria-hidden="true">${esc(String(nm).replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase())}</span>`;
const tlink = id => `<a class="tl" href="#/team/${id}">${esc(name(id))}</a>`;
const chipsHtml = s => s ? `<span class="chips-f" role="img" aria-label="Last ${s.length} results, oldest first: ${s.split('').map(c => ({ W: 'won', D: 'drew', L: 'lost' }[c])).join(', ')}">${s.split('').map(c => `<span class="chip ${c}">${c}</span>`).join('')}</span>` : '<span class="muted">No games yet</span>';
const dotsHtml = s => `<span class="dots" role="img" aria-label="${(s || '').split('').join(' ')}">${(s || '').split('').map(c => `<i class="${c}"></i>`).join('')}</span>`;
const rkText = r => `${ord(r)} of ${N}`;
const ex = (key, label) => `<button class="ex" data-ex="${key}">${label}</button>`;
const empty = (title, why, extra = '') => `<div class="empty"><b>${title}</b>${why}${extra}</div>`;

function verdict(ph, pa) {
  const g = ph - pa, a = Math.abs(g);
  if (a < 0.05) return { fav: null, lvl: '' };
  return { fav: g > 0 ? 'h' : 'a', lvl: a < 0.15 ? 'slight favourites' : a < 0.30 ? 'favourites' : 'strong favourites' };
}
function vText(m, p) {
  const v = verdict(p.h, p.a);

const vShort = (m, p) => { const v = verdict(p.h, p.a); return v.fav ? `${sname(v.fav === 'h' ? m.home : m.away)} ${v.lvl}` : 'Too close to call'; };

// The team a match is "about": Dereham when they're in it, otherwise the home side.
const focus = m => (m.away === ME ? m.away : m.home);
const pFor = (m, p, id) => (id === m.home ? p.h : p.a);
function deltaFor(f) {
  const h = f.hist; if (!h || h.length < 2) return null;
  const id = focus(f), k = id === f.home ? 'h' : 'a';
  return { id, d: h[h.length - 1][k] - h[h.length - 2][k], since: h[h.length - 2].d };
}
function deltaHtml(d) {
  if (d == null || Math.abs(d) < 0.005) return '';
  return `<span class="delta ${d > 0 ? 'up' : 'down'}"><span aria-hidden="true">${d > 0 ? '▲' : '▼'}</span><span class="sr">${d > 0 ? 'up' : 'down'}</span> ${Math.round(Math.abs(d) * 100)}%</span>`;
}
// Places moved in the table since roughly a week ago (the last standings at least 4 days older than the latest).
function movement(id) {
  const h = T[id] && T[id].pos_hist; if (!h || h.length < 2) return null;
  const last = h[h.length - 1], cut = dt(last.d).getTime() - 4 * 864e5;
  let base = null; h.forEach(x => { if (dt(x.d).getTime() <= cut) base = x; });
  return base ? { n: base.pos - last.pos, since: base.d } : null;
}
const mvCell = m => !m || !m.n ? '<span class="mv" aria-label="no change">–</span>'
  : m.n > 0 ? `<span class="mv up" title="Up ${m.n} since ${fshort(m.since)}"><span aria-hidden="true">▲</span><span class="sr">up </span>${m.n}</span>`
  : `<span class="mv down" title="Down ${-m.n} since ${fshort(m.since)}"><span aria-hidden="true">▼</span><span class="sr">down </span>${-m.n}</span>`;
const mvText = m => !m ? '' : m.n > 0 ? `, up ${m.n} since ${fshort(m.since)}` : m.n < 0 ? `, down ${-m.n} since ${fshort(m.since)}` : `, same place as on ${fshort(m.since)}`;
const updText = () => { const s = fdate(D.updated, true); return /^(Today|Yesterday|Tomorrow)/.test(s) ? s[0].toLowerCase() + s.slice(1) : s; };

// The model, so the compare page can price any pairing.
function poisson(k, l) { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; }
function predict(h, a) {
  const ha = D.home_adv, avg = D.avg, att = t => T[t].att, dfn = t => 1 / T[t].def;
  const lh = avg * ha * att(h) * dfn(a), la = avg / ha * att(a) * dfn(h), rho = -0.08, n = 12;
  let ph = 0, pd = 0, pa = 0, s = 0;
  const M = [];
  for (let i = 0; i <= n; i++) { M[i] = []; for (let j = 0; j <= n; j++) M[i][j] = poisson(i, lh) * poisson(j, la); }
  M[0][0] *= Math.max(0, 1 - lh * la * rho); M[0][1] *= Math.max(0, 1 + lh * rho);
  M[1][0] *= Math.max(0, 1 + la * rho); M[1][1] *= Math.max(0, 1 - rho);
  for (let i = 0; i <= n; i++) for (let j = 0; j <= n; j++) { s += M[i][j]; if (i > j) ph += M[i][j]; else if (i === j) pd += M[i][j]; else pa += M[i][j]; }
  return { h: ph / s, d: pd / s, a: pa / s, xg: [lh, la] };
}

// A team's results from its own point of view, oldest first.
function games(id) {
  return RES.filter(r => r.kind === 'played' && (r.home === id || r.away === id))
    .slice().sort(by(r => r.date)).map(r => {
      const home = r.home === id, gf = home ? r.hg : r.ag, ga = home ? r.ag : r.hg;
      return { r, opp: home ? r.away : r.home, venue: home ? 'H' : 'A', gf, ga,
        res: gf > ga ? 'W' : gf < ga ? 'L' : 'D', pre: r.pre ? (home ? r.pre.h : r.pre.a) : null };
    });
}
const fixturesOf = id => FX.filter(f => f.home === id || f.away === id);
const meetings = (a, b) => RES.filter(r => r.kind === 'played' && ((r.home === a && r.away === b) || (r.home === b && r.away === a)));
function commonOpps(a, b) {
  const ga = games(a), gb = games(b), out = [];
  const opps = new Set(ga.map(g => g.opp).filter(o => o !== b && gb.some(x => x.opp === o)));
  opps.forEach(o => out.push({ o, a: ga.filter(g => g.opp === o), b: gb.filter(g => g.opp === o) }));
  return out.sort(by(x => T[x.o].row.pos));
}
const ppg = gs => gs.length ? gs.reduce((s, g) => s + (g.res === 'W' ? 3 : g.res === 'D' ? 1 : 0), 0) / gs.length : 0;
const nextOpp = () => { const f = BY[D.next]; return f ? (f.home === ME ? f.away : f.home) : IDS.find(x => x !== ME); };

/* ================= plain-English glossary: one sheet explains everything ================= */

const G_ORDER = ['chance', 'verdict', 'change', 'strength', 'attack', 'defence', 'form', 'luck', 'runin', 'xg', 'projected', 'called', 'odds', 'arrows', 'ht', 'data'];

/* ================= shared pieces ================= */
function card(title, body, o = {}) {
  const head = title ? `<div class="card-h"><h2>${title}</h2>${o.aside ? `<span class="aside">${o.aside}</span>` : ''}</div>` : '';
  return `<section class="card ${o.cls || ''}">${head}${body}</section>`;
}
// A card that folds on phones (with a one-line summary) and is always open on laptops.
const fold = (title, summary, body, cls = '') =>
  `<details class="card fold ${cls}"${WIDE() ? ' open' : ''}><summary><h2>${title}</h2><span class="sum">${summary}</span></summary>${body}</details>`;

function split3(L, R, pl, pd, pr, size = '') {
  return `<div class="split ${size}" role="img" aria-label="${esc(name(L))} ${pct(pl)}, draw ${pct(pd)}, ${esc(name(R))} ${pct(pr)}">
    <i style="flex:${pl.toFixed(3)};background:${tone(L, R)}"></i><i style="flex:${pd.toFixed(3)}"></i><i style="flex:${pr.toFixed(3)};background:${tone(R, L)}"></i></div>`;
}
// Three numbers over one bar: left team, draw, right team.
function triple(L, R, pl, pd, pr, o = {}) {
  const val = x => o.odds ? (x > 0.01 ? (1 / x).toFixed(2) : '–') : pct(x);
  const hap = k => o.actual === k ? '<span class="hap">✓ happened</span>' : '';
  return `<div class="tri ${o.sm ? 'sm' : ''}">
    <div class="tri-n" aria-hidden="true"><div><b>${val(pl)}</b></div><div class="dn"><b>${val(pd)}</b></div><div><b>${val(pr)}</b></div></div>
    ${split3(L, R, pl, pd, pr, o.sm ? '' : 'lg')}
    <div class="tri-l"><span><i class="k" style="background:${tone(L, R)}"></i><span class="nm">${esc(sname(L))}</span>${hap('l')}</span><span>Draw${hap('d')}</span>
      <span>${hap('r')}<span class="nm">${esc(sname(R))}</span><i class="k" style="background:${tone(R, L)}"></i></span></div></div>`;
}

function whenCell(iso, withDate) {
  const d = dt(iso), t = ftime(iso);
  if (!d) return '<b>TBC</b>';
  return withDate ? `<b>${d.getDate()} ${MON[d.getMonth()]}</b>${DOW[d.getDay()]}${t ? ' ' + t : ''}` : `<b>${t || 'TBC'}</b>`;
}
function fxRow(f, o = {}) {
  const v = verdict(f.p.h, f.p.a), mine = f.home === ME || f.away === ME, dl = deltaFor(f);
  const t = (id, p, top) => `<span class="fx-t ${top ? 'top' : ''}">${mono(id, 's')}<span class="nm">${esc(name(id))}</span><span class="v">${pct(p)}</span></span>`;
  const moved = dl && Math.abs(dl.d) >= 0.005 ? `<span>${esc(sname(dl.id))} ${deltaHtml(dl.d)} since ${fshort(dl.since)}</span>` : '';
  return `<a class="fx ${mine && o.hl !== false ? 'mine' : ''}" href="#/match/${f.id}"><span class="fx-when">${whenCell(f.date, o.date)}</span>
    <span class="fx-body">${t(f.home, f.p.h, v.fav === 'h')}${t(f.away, f.p.a, v.fav === 'a')}${split3(f.home, f.away, f.p.h, f.p.d, f.p.a, 'sm')}${o.flag || (mine && moved) ? `<span class="fx-flag">${o.flag ? `<b>${esc(o.flag)} of these.</b> ` : ''}${mine ? moved : ''}</span>` : ''}</span>

}
function resRow(r, o = {}) {
  const wo = r.kind !== 'played', mine = r.home === ME || r.away === ME;
  const hw = wo ? r.kind === 'walkover-H' : r.hg > r.ag, aw = wo ? r.kind === 'walkover-A' : r.ag > r.hg;
  const t = (id, g, w, lost) => `<span class="fx-t ${w ? 'top' : ''} ${lost ? 'dim' : ''}">${mono(id, 's')}<span class="nm">${esc(name(id))}</span><span class="v sc">${wo ? (w ? 'W' : '–') : g}</span></span>`;

    <span class="fx-body">${t(r.home, r.hg, hw, aw)}${t(r.away, r.ag, aw, hw)}</span>
    <span class="fx-side">${side}</span>${mk ? `<span class="fx-ic ${mk.c}" role="img" aria-label="${mk.t}">${mk.i}</span>` : '<span></span>'}</a>`;

const METRICS = [

function compareBars(A, B, short) {
  const a = T[A], b = T[B];
  const sv = (t, f) => t.split.all ? t.split.all[f] : 0;
  let rows = [
    ['strength', 'Strength', t => t.power, v => sgn(v, 2), true, 'power'],
    ['attack', 'Attack', t => t.att, rel, true, 'att'],
    ['defence', 'Defence', t => t.def, rel, true, 'def'],
    ['form', 'Form, last 5', t => t.formr, v => sgn(v, 1), true, 'form'],
    [null, 'Points a game', t => sv(t, 'ppg'), v => v.toFixed(2), true],
    [null, 'Scored a game', t => sv(t, 'gf'), v => v.toFixed(1), true],
    [null, 'Conceded a game', t => sv(t, 'ga'), v => v.toFixed(1), false],
    [null, 'Clean sheets', t => sv(t, 'cs'), v => pct(v), true],
    ['luck', 'Luck', t => t.luck, v => sgn(v, 1), true, 'luck'],
  ];
  if (short) rows = rows.slice(0, 5);
  const ca = tone(A, B), cb = tone(B, A);
  const body = rows.map(([g, label, get, fmt, hiBetter, rk]) => {
    const vals = IDS.map(i => get(T[i]) || 0), lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const va = get(a) || 0, vb = get(b) || 0;
    const w = v => clamp(((hiBetter ? v - lo : hi - v) / span) * 100, 4, 100);
    const aw = hiBetter ? va > vb : va < vb, bw = hiBetter ? vb > va : vb < va;
    const r = t => rk ? `<small>${ord(t.rk[rk])}</small>` : '';
    return `<div class="cmp"><div class="cmp-v ${aw ? 'win' : ''}">${fmt(va)}${r(a)}</div>
      <div><div class="cmp-l">${g ? ex(g, label) : label}</div><div class="bars"><div class="bar lft"><span style="width:${w(va).toFixed(0)}%;background:${ca}"></span></div><div class="bar"><span style="width:${w(vb).toFixed(0)}%;background:${cb}"></span></div></div></div>
      <div class="cmp-v ${bw ? 'win' : ''}">${fmt(vb)}${r(b)}</div></div>`;
  }).join('');
  return `<div class="who"><a href="#/team/${A}">${mono(A)}<span>${esc(name(A))}</span></a><a href="#/team/${B}">${mono(B)}<span>${esc(name(B))}</span></a></div>${body}
    <p class="note">Longer bar is better. Small numbers are ranks in the division.</p>`;
}

function gameRows(gs, limit) {

function commonCard(A, B) {

function playersMini(id, n = 3) {

  if (!T[A].has_players && !T[B].has_players) return fold('Top scorers', 'Not entered', empty('No scorers entered for either team', 'Clubs only sometimes record scorers on Full-Time, so this can fill in later in the season.'));

}

/* ================= charts: one component, with a crosshair, keyboard reading and a table fallback ================= */
const CH = {}; let chSeq = 0;
const FMT = { pct: v => pct(v), num: v => sgn(v, 2), pos: v => ord(v) };

// series: [{name, cls ('a'|'b'|'d'|'n'), vals:[number|null], area}]
function lineChart(o) {

function lineGeom(o, W) {

  return { H, L, R, TP, B, n, x: i => n === 1 ? (L + (W - L - R) / 2) : L + i * (W - L - R) / (n - 1) };

  });

// Monotone cubic (Fritsch–Carlson): smooth, but never bulges past the real values.
function smoothPath(p) {
  const f = v => v.toFixed(1);
  if (p.length < 3) return 'M' + p.map(q => f(q[0]) + ',' + f(q[1])).join('L');
  const n = p.length, m = [], t = [];
  for (let i = 0; i < n - 1; i++) m[i] = (p[i + 1][1] - p[i][1]) / ((p[i + 1][0] - p[i][0]) || 1);
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let d = `M${f(p[0][0])},${f(p[0][1])}`;
  for (let i = 0; i < n - 1; i++) {
    const dx = (p[i + 1][0] - p[i][0]) / 3;
    d += `C${f(p[i][0] + dx)},${f(p[i][1] + t[i] * dx)} ${f(p[i + 1][0] - dx)},${f(p[i + 1][1] - t[i + 1] * dx)} ${f(p[i + 1][0])},${f(p[i + 1][1])}`;
  }
  return d;
}
